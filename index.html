<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<title>DumansStudio — Üye Paneli</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DumansStudio">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fcfcfc;--bg2:#f6f5f3;--bg3:#eeece7;
  --card:#ffffff;--card2:#faf9f7;
  --border:#ece9e3;--border2:#dcd6ca;
  --text:#141414;--text2:#555555;--text3:#9b958a;
  --gold:#D4AF37;--gold-light:#E8C766;--gold-dark:#946C18;
  --gold-bg:rgba(210,169,65,.1);--gold-border:rgba(148,108,24,.25);
  --green:#5A8A5A;--green-bg:rgba(90,138,90,.1);--green-border:rgba(90,138,90,.25);
  --red:#C0302C;--red-bg:rgba(192,48,44,.08);--red-border:rgba(192,48,44,.2);
  --blue:#5A7A9A;--blue-bg:rgba(90,122,154,.1);--blue-border:rgba(90,122,154,.25);
  --pink:#C07A90;--pink-bg:rgba(192,122,144,.1);--pink-border:rgba(192,122,144,.25);
  --yellow:#D2A941;--yellow-bg:rgba(210,169,65,.1);--yellow-border:rgba(210,169,65,.25);
  --purple:#8A6A9A;--purple-bg:rgba(138,106,154,.1);--purple-border:rgba(138,106,154,.25);
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Jost',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.01em;margin:0;padding:0;-webkit-font-smoothing:antialiased}

/* ── LOADING ── */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:36px;height:36px;border:3px solid #E8DFD0;border-top-color:#946C18;border-radius:50%;animation:spin .8s linear infinite}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 40%,#0d0b09 0%,#070608 60%,#050406 100%);overflow-y:auto;-webkit-overflow-scrolling:touch}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,#975B09,#946C18,#D4AF37);color:white;border:none;border-radius:10px;font-size:12px;font-weight:700;letter-spacing:2px;cursor:pointer;box-shadow:0 4px 14px rgba(148,108,24,.28)}

/* ── APP GRID ── */
#app{display:none}
#app.show{display:flex !important;flex-direction:column;min-height:100vh}
@media(min-width:768px){
  body{background:#EDE8DC}
  #app{
    max-width:1400px;
    margin:0 auto;
    background:var(--bg);
    box-shadow:0 0 40px rgba(148,108,24,.08);
    height:100vh;
    overflow:hidden;
    grid-template-columns:200px 1fr;
    grid-template-rows:52px 1fr;
  }
  #app.show{display:grid !important}
  .topbar{
    grid-column:1/-1;
    grid-row:1;
    display:flex;
    align-items:center;
    padding:0 20px;
    height:52px;
    background:var(--bg);
    border-bottom:0.5px solid var(--border);
    z-index:100;
  }
  .sidebar{
    grid-row:2;
    grid-column:1;
    display:flex !important;
    flex-direction:column;
    padding:10px 8px;
    gap:2px;
    border-right:0.5px solid var(--border);
    background:var(--bg);
    overflow-y:auto;
    height:calc(100vh - 52px);
  }
  .pages{
    grid-row:2;
    grid-column:2;
    overflow-y:auto;
    height:calc(100vh - 52px);
  }
  .bottom-nav{display:none !important}
  #login-screen{width:100vw;height:100vh}
}
@media(min-width:1200px){
  #app.show{grid-template-columns:220px 1fr;max-width:1600px}
}

/* ── TOP BAR (mobile) ── */
.topbar{
  display:flex;
  align-items:center;
  padding:0 14px;
  height:52px;
  background:var(--bg);
  border-bottom:0.5px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}

/* ── SIDEBAR ── */
.sidebar{display:none;flex-direction:column}
.snav-sec{font-size:9px;color:var(--text3);letter-spacing:1.5px;padding:10px 12px 4px;text-transform:uppercase;font-weight:500}
.snav-btn{
  display:flex;align-items:center;gap:9px;
  padding:9px 12px;border-radius:8px;
  background:transparent;border:none;
  cursor:pointer;color:var(--text2);
  font-size:13px;font-weight:500;
  text-align:left;width:100%;
  transition:background .15s;
  white-space:nowrap;
}
.snav-btn:hover{background:var(--card2)}
.snav-btn.act{background:#F9EFBD;color:#946C18;font-weight:600;border-left:2.5px solid #946C18;padding-left:9px}
.sidebar-footer{margin-top:auto;padding:10px;background:var(--card2);border-radius:8px;border:0.5px solid var(--border)}

/* ── PAGES ── */
.pages{flex:1;overflow-y:auto}
.page{display:none;min-height:100%}
.page.active{display:block}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg);border-top:0.5px solid var(--border);
  display:flex;z-index:99;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:8px 4px 6px;cursor:pointer;border:none;
  background:transparent;color:var(--text3);
  font-size:9px;gap:2px;transition:color .2s;
}
.nav-btn.active{color:var(--gold-dark);font-weight:600}

/* ── GENEL ── */
.card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 1px 8px rgba(148,108,24,.05);margin-bottom:12px}
.section-title{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;padding:12px 0 6px}
.row{display:flex;align-items:center;gap:8px}
.pbar{height:6px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-top:8px}
.pfill{height:100%;border-radius:99px;transition:width .5s ease}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600}
.b-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.b-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.b-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.b-yellow{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.b-pink{background:var(--pink-bg);color:var(--pink);border:1px solid var(--pink-border)}
.b-purple{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.b-pilates{background:var(--gold-bg);color:var(--gold-dark);border:1px solid var(--gold-border)}
.b-ems{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.alert{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:10px;line-height:1.5}
.a-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.a-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.a-yellow{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.a-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.btn{padding:10px 18px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:13px;font-weight:600}
.btn-primary{background:linear-gradient(135deg,#975B09,#946C18,#D4AF37);color:white;border:none;box-shadow:0 3px 10px rgba(148,108,24,.25)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card2);color:var(--text2);cursor:pointer;font-weight:600}
.metric{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:16px}
.metric-val{font-size:28px;font-weight:700;font-family:Cormorant Garamond,Georgia,serif;letter-spacing:-1px;margin-bottom:4px}
.metric-lbl{font-size:10px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:500}
.divider{border:none;border-top:0.5px solid var(--border);margin:10px 0}
.water-circle{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;position:relative}
.water-inner{width:110px;height:110px;border-radius:50%;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.water-val{font-size:22px;font-weight:800;color:var(--blue)}
.water-lbl{font-size:11px;color:var(--text2)}
.cycle-day{aspect-ratio:1;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;font-weight:600;background:var(--card2);color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}
@media(max-width:767px){
  .page{padding:14px 16px 80px}
  #app.show{display:block !important}
  .pages{padding-bottom:0}
}

#ds-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 44%,#0d0b09 0%,#070608 60%,#050406 100%);transition:opacity .9s ease;}
#ds-splash.hide{opacity:0;pointer-events:none;}
#ds-splash .dss-wrap{display:flex;flex-direction:column;align-items:center;}
#ds-splash #dss-canvas{width:clamp(220px,64vw,300px);height:clamp(220px,64vw,300px);display:block;}
#ds-splash .dss-load{margin-top:-6px;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:rgba(243,241,234,.55);font-family:Jost,-apple-system,sans-serif;}
#ds-splash .dss-pct{margin-top:10px;font-family:Cormorant Garamond,Georgia,serif;font-size:34px;line-height:1;color:#E8C766;font-variant-numeric:tabular-nums;}
#ds-splash .dss-pct i{font-size:17px;color:rgba(243,241,234,.4);font-style:normal;margin-left:2px;}
/* ── ANA SAYFA: bilgisayarda 3, tablette 2 sütun ── */
.ana-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start}
@media(max-width:1099px){.ana-grid{grid-template-columns:1fr 1fr}.ana-grid>div:last-child{grid-column:1/-1}}
/* ── SAYFA BAŞLIĞI + SAĞLIK FORMU / HESABIM SAYFA BOŞLUĞU ── */
.page-title{font-size:22px;font-weight:700;color:#2A2015;margin-bottom:16px}
#c-saglikform,#c-hesap{padding:24px 32px}
@media(max-width:767px){.page-title{font-size:18px}#c-saglikform,#c-hesap{padding:14px 16px}}
/* ── ÜST BAR + SIDEBAR: açık eski palet ── */
.snav-btn.act{ background:#F9EFBD !important; color:#946C18 !important; border-left:2.5px solid #946C18 !important; font-weight:600; }
</style>
<!-- ── DS TEMA (ortak görünüm katmanı; iki panelde aynı) ── -->
<style id="ds-tema">
:root{
  --ds-ink:#1A1714;--ds-ink7:#3A342E;--ds-ink5:#6E655B;--ds-ink3:#A89E92;
  --ds-gold:#D4AF37;--ds-gold6:#B8942A;--ds-gold7:#8F7120;--ds-goldbg:#FBF5E2;--ds-goldline:#EFDFA8;
  --ds-line:#E6DED0;--ds-stone:#F5F1EA;--ds-paper:#FAF8F4;
  --bg:#FAF8F4;--bg2:#F5F1EA;--bg3:#EAE3D7;--card:#FFFFFF;--card2:#FAF8F4;
  --border:#E6DED0;--border2:#D9CFBE;
  --text:#1A1714;--text2:#6E655B;--text3:#A89E92;
  --gold:#D4AF37;--gold-light:#E8D48A;--gold-dark:#8F7120;--gold-deep:#6F5818;--gold-bg:#FBF5E2;
  --green:#5F7F5A;--red:#A2463B;
}
body{font-family:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif !important;font-variant-numeric:lining-nums;color:var(--ds-ink);-webkit-font-smoothing:antialiased}
[style*="Georgia"]{font-family:'Cormorant Garamond',Georgia,serif !important;font-variant-numeric:lining-nums}
input,select,textarea,button{font-family:inherit}

/* Simgeler */
.ds-ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none;display:inline-block}
.ds-nokta{display:inline-block;width:.6em;height:.6em;border-radius:50%;vertical-align:.05em}

/* Kartlar */
.card,.metric,.metric-card,.ogr-card,.card2{border-radius:16px !important;border:1px solid var(--ds-line) !important;box-shadow:0 1px 2px rgba(26,23,20,.04) !important}
.card,.metric,.metric-card,.ogr-card{background:#fff}
.metric-label,.metric-lbl,.section-title,.snav-section,.snav-sec{font-family:'Jost',sans-serif !important;font-size:10.5px !important;font-weight:500 !important;letter-spacing:.2em !important;text-transform:uppercase;color:var(--ds-ink5) !important}
.metric-value,.metric-val{font-family:'Cormorant Garamond',Georgia,serif !important;font-weight:500 !important;letter-spacing:0 !important}

/* Düğmeler */
.btn{border-radius:11px !important;font-weight:500 !important;letter-spacing:.01em;transition:background .15s,border-color .15s}
.btn-primary{background:var(--ds-ink) !important;border:1px solid var(--ds-ink) !important;color:#fff !important;box-shadow:none !important}
.btn-primary .ds-ic{color:var(--gold-light)}
.btn-primary:hover{background:#2C2621 !important}
.btn-ghost,.btn-sm{background:#fff;border:1px solid var(--ds-line);color:var(--ds-ink7)}
.btn-ghost:hover{border-color:var(--border2)}
.btn-sm{border-radius:10px !important}
.btn-wa{background:#fff !important;color:#1F7A45 !important;border:1px solid #BFE0CB !important}

/* Uyarılar */
.alert{border-radius:12px !important;font-size:13px;line-height:1.55}
.a-gold,.a-yellow{background:var(--ds-goldbg) !important;border:1px solid var(--ds-goldline) !important;color:#5E4B14 !important;font-weight:400 !important}
.a-red{background:#FBF1EF !important;border:1px solid #EBCFC9 !important;color:#8E3A30 !important}
.a-green{background:#F2F6F0 !important;border:1px solid #D3E0CF !important;color:#4A6645 !important}
.a-blue{background:#F1F4F7 !important;border:1px solid #D5DEE7 !important;color:#4A6076 !important}
.alert .ds-ic{margin-right:4px}

/* Alanlar */
input,select,textarea,.field-input{border-radius:11px !important;border-color:var(--ds-line)}
input:focus,select:focus,textarea:focus{border-color:var(--ds-gold6) !important;box-shadow:0 0 0 3px rgba(212,175,55,.15);outline:none}
.field-label{font-size:10.5px !important;letter-spacing:.18em !important;font-weight:500 !important;color:var(--ds-ink5) !important}

/* Üst çubuk */
.top-bar,.topbar{background:#fff !important;border-bottom:1px solid var(--ds-line) !important}
.top-bar-title{background:none !important;-webkit-text-fill-color:var(--ds-ink) !important;color:var(--ds-ink) !important;font-family:'Cormorant Garamond',Georgia,serif !important;font-size:17px !important;font-weight:600 !important;letter-spacing:.14em !important}
.top-bar-date{letter-spacing:.14em;text-transform:uppercase;font-size:9.5px !important}
.icon-btn{width:38px !important;height:38px !important;border-radius:12px !important;background:#fff !important;border:1px solid var(--ds-line) !important;color:var(--ds-ink5);font-size:17px !important}
.icon-btn:hover{color:var(--ds-ink)}

/* Alt menü (telefon) */
.bottom-nav{background:#fff !important;border-top:1px solid var(--ds-line) !important;box-shadow:none !important}
.nav-btn{position:relative;color:var(--ds-ink3) !important;font-weight:400 !important;letter-spacing:.03em}
.nav-btn.active{color:var(--ds-ink) !important;font-weight:500 !important}
.nav-btn.active .ds-ic{color:var(--ds-gold6)}
.nav-btn.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:2px;border-radius:2px;background:var(--ds-gold)}
.nav-icon{font-size:20px !important}

/* Yan menü (tablet/bilgisayar) */
.side-nav-desktop,.sidebar{background:#fff !important;border-right:1px solid var(--ds-line) !important}
.snav-btn{color:var(--ds-ink7) !important;border-radius:10px !important;border-left:0 !important;padding-left:12px !important;font-weight:400 !important}
.snav-btn .ds-ic{color:var(--ds-ink3);font-size:17px}
.snav-btn:hover{background:var(--ds-paper) !important}
.snav-btn.active,.snav-btn.act{background:var(--ds-stone) !important;color:var(--ds-ink) !important;font-weight:500 !important;box-shadow:inset 2px 0 0 var(--ds-gold)}
.snav-btn.active .ds-ic,.snav-btn.act .ds-ic{color:var(--ds-gold6)}

/* Rozetler */
.b-pilates,.b-ems{background:#FDF9EC !important;color:var(--ds-gold7) !important;border:1px solid var(--gold-light) !important;font-size:10px !important;font-weight:500 !important;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px !important}
.ders-badge{background:var(--ds-stone) !important;border-color:var(--ds-line) !important;color:var(--ds-ink5) !important}
.ders-item{border-left:0 !important;border:1px solid var(--ds-line);border-radius:14px !important;box-shadow:none !important}
.ders-saat{font-family:'Cormorant Garamond',Georgia,serif !important;font-weight:500 !important;font-size:20px !important;color:var(--ds-ink) !important}
.progress-bar,.pbar{height:4px !important;background:var(--bg3) !important}
.progress-fill{background:linear-gradient(90deg,var(--ds-gold6),var(--ds-gold)) !important}
</style>
<style id="ds-ogrenci">
.ds-eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--ds-ink5)}
.ds-selam{margin:2px 0 16px}
.ds-selam .ds-eyebrow{color:var(--ds-gold7)}
.ds-selam h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:32px;line-height:1.1;margin:6px 0 4px;color:var(--ds-ink)}
.ds-selam p{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:17px;color:var(--ds-ink5);line-height:1.4}
.ds-kart-bas{display:flex;align-items:center;gap:8px;color:var(--ds-gold6);margin-bottom:12px;font-size:17px}
.ds-hafta{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ds-gun{text-align:center;font-size:10px;letter-spacing:.08em;color:var(--ds-ink3);text-transform:uppercase}
.ds-gun i{display:grid;place-items:center;margin:6px auto 0;width:34px;height:34px;border-radius:50%;border:1px solid var(--ds-line);font-style:normal;font-size:13px;color:var(--ds-ink5);font-weight:500;text-transform:none;letter-spacing:0}
.ds-gun.ders i{border-color:var(--ds-gold);color:var(--ds-gold7);background:var(--ds-goldbg)}
.ds-gun.bugun{color:var(--ds-ink);font-weight:500}
.ds-gun.bugun i{background:var(--ds-ink);color:var(--gold-light);border-color:var(--ds-ink)}
.ds-ust-btn{height:38px;min-width:38px;padding:0 10px;border-radius:12px;border:1px solid var(--ds-line);background:#fff;color:var(--ds-ink5);display:inline-flex;align-items:center;justify-content:center;gap:6px;font:500 13px 'Jost',sans-serif;cursor:pointer;margin-left:8px;font-size:13px}
.ds-ust-btn .ds-ic{font-size:17px}
.ds-ust-btn:hover{color:var(--ds-ink)}
.ds-ust-ad{color:var(--ds-ink7)}
/* Dar telefonlarda üst çubuk sığsın: ad yazısı gizlenir, yalnızca simge kalır */
@media(max-width:420px){
  .ds-ust-btn{margin-left:6px;min-width:38px;padding:0}
  .ds-ust-ad{font-size:0 !important;gap:0}
  .ds-ust-ad .ds-ic{width:20px;height:20px}
  .topbar>div:nth-child(2) div:first-child{font-size:14px !important;letter-spacing:1.5px !important}
}
/* Büyük rakamlar: kalın yerine zarif */
[style*="Cormorant"][style*="font-weight:800"],[style*="Cormorant"][style*="font-weight:700"]{font-weight:500 !important}
[style*="background:#F9EFBD"]{background:var(--ds-goldbg) !important}
[style*="background:#D2A941;color:white"]{background:var(--ds-ink) !important;color:var(--gold-light) !important}
[style*="border:0.5px solid #D4C8B0"]{border-color:var(--ds-goldline) !important}
.page-title{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500 !important;font-size:28px !important;color:var(--ds-ink) !important}
@media(max-width:767px){.page-title{font-size:24px !important}}
/* Geliştirmeler: listeler, pencereler, grafikler, rozetler, bildirimler */
.ds-ek-kap{padding:24px 32px 0}
@media(max-width:767px){.ds-ek-kap{padding:0 0 4px}}
.ds-ust-bolum{margin-bottom:18px}
.ds-liste{padding:0 !important;overflow:hidden}
.ds-sat{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--ds-stone)}
.ds-sat:first-child{border-top:0}
.ds-sat-tarih{text-align:center;line-height:1}
.ds-sat-tarih b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;font-weight:500;color:var(--ds-ink)}
.ds-sat-tarih small{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ds-ink3)}
.ds-sat-orta{min-width:0}
.ds-sat-ad{font-size:14px;font-weight:500;color:var(--ds-ink)}
.ds-sat-sag{text-align:right}
.ds-tutar{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;font-weight:600;color:var(--ds-ink)}
.ds-kucuk{font-size:11.5px;color:var(--ds-ink5);margin-top:2px;line-height:1.5}
.ds-durum{display:inline-block;font-size:10.5px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;border:1px solid var(--ds-line);color:var(--ds-ink5);white-space:nowrap}
.ds-yesil{color:#4A6645;background:#F2F6F0;border-color:#D3E0CF}
.ds-kirmizi{color:#8E3A30;background:#FBF1EF;border-color:#EBCFC9}
.ds-altin{color:var(--ds-gold7);background:var(--ds-goldbg);border-color:var(--ds-goldline)}
.ds-gri{color:var(--ds-ink5);background:var(--ds-stone)}
.ds-bos{font-size:13px;color:var(--ds-ink3);padding:18px;border:1px dashed var(--ds-line);border-radius:14px;text-align:center}
.ds-link{background:none;border:0;padding:0;color:var(--ds-gold7);font:inherit;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.ds-bilgi{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ds-ink5);line-height:1.6;padding:12px 14px;border:1px solid var(--ds-line);border-radius:12px;background:#fff;margin-bottom:14px}
.ds-bilgi .ds-ic{color:var(--ds-gold6);margin-top:2px}
.ds-riza{margin-bottom:16px}
.ds-onay{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.55;color:var(--ds-ink7);cursor:pointer}
.ds-onay input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:#1A1714}
/* Pencere */
.ds-pencere-ov{position:fixed;inset:0;background:rgba(20,14,6,.5);z-index:9600;display:flex;align-items:center;justify-content:center;padding:16px}
.ds-pencere{background:#fff;border-radius:18px;max-width:420px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.ds-pencere-baslik{font-family:'Cormorant Garamond',Georgia,serif;font-size:25px;font-weight:500;margin:6px 0 14px;color:var(--ds-ink);line-height:1.15}
.ds-pencere-btn{display:flex;gap:8px;justify-content:flex-end}
.ds-secenek{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--ds-line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.ds-secenek:has(input:checked){border-color:var(--ds-gold6);background:var(--ds-goldbg)}
.ds-secenek input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:#1A1714}
.ds-secenek b{display:block;font-weight:500;font-size:14px}
.ds-secenek small{display:block;font-size:12px;color:var(--ds-ink5);margin-top:2px;line-height:1.45}
.ds-alan{display:flex;flex-direction:column;gap:5px;margin:4px 0 10px}
.ds-alan>span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--ds-ink5)}
.ds-alan input{padding:11px 12px;border:1px solid var(--ds-line);border-radius:11px;font-size:14px;width:100%}
/* Grafikler */
.ds-grafikler{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.ds-grafik{margin:0;background:#fff;border:1px solid var(--ds-line);border-radius:16px;padding:12px 12px 6px}
.ds-grafik figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.ds-grafik svg{width:100%;height:auto;display:block;overflow:visible}
.ds-g-taban{stroke:var(--ds-line);stroke-width:1}
.ds-g-cizgi{fill:none;stroke:var(--ds-gold6);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ds-g-nokta circle:not(.ds-g-hedef){fill:var(--ds-gold6);stroke:#fff;stroke-width:2}
.ds-g-hedef{fill:transparent;stroke:none;cursor:pointer}
.ds-g-deger{font:500 11px 'Jost',sans-serif;fill:var(--ds-ink7);opacity:0}
.ds-g-deger.hep,.ds-g-nokta:hover .ds-g-deger,.ds-g-nokta:focus .ds-g-deger{opacity:1}
.ds-g-nokta:focus{outline:none}
.ds-g-nokta:focus circle:not(.ds-g-hedef){stroke:var(--ds-ink)}
.ds-g-eksen{font:400 10px 'Jost',sans-serif;fill:var(--ds-ink3)}
/* Ana sayfa ekleri */
.ds-ana-ek{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
.ds-ana-ek .card{margin:0}
@media(min-width:768px){.ds-ana-ek{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:16px}}
.ds-rozet-sira{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ds-rozet-o{width:44px;height:44px;border-radius:50%;border:1px dashed var(--ds-line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--ds-ink3)}
.ds-rozet-o b{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;font-weight:600}
.ds-rozet-o small{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase}
.ds-rozet-o.kazanildi{border:1px solid var(--ds-gold);background:var(--ds-goldbg);color:var(--ds-gold7)}
.cubuk-ince{height:4px;border-radius:4px;background:var(--bg3);overflow:hidden}
.cubuk-ince i{display:block;height:100%;background:linear-gradient(90deg,var(--ds-gold6),var(--ds-gold))}
.ds-etkinlik{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ds-stone)}
.ds-etkinlik:first-of-type{border-top:0;padding-top:0}
.ds-davet-kod{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:600;letter-spacing:.16em;text-align:center;padding:10px;margin:12px 0;border:1px dashed var(--ds-goldline);border-radius:12px;background:var(--ds-goldbg);color:var(--ds-ink);user-select:all}
.ds-odul{display:flex;flex-direction:column;gap:10px;padding:12px 14px;margin:0 0 12px;border-radius:12px;border:1px solid var(--ds-line);background:#fff}
.ds-odul b{display:block;font-size:13.5px;font-weight:600;color:var(--ds-ink)}
.ds-odul small{display:block;font-size:12px;line-height:1.55;color:var(--ds-ink5);margin-top:3px}
.ds-odul-aktif{border-color:var(--ds-goldline);background:var(--ds-goldbg)}
.ds-odul .btn{width:100%}
.ds-indirimli{font-size:12px;color:var(--ds-gold7);margin:-2px 0 6px}
.ds-indirimli s{color:var(--ds-ink5);margin-right:4px}
.ds-indirimli-k{font-size:10px;margin:0 0 2px}
/* Üyelik sözleşmesi onayı */
.ds-sozlesme-ov{position:fixed;inset:0;z-index:9800;background:rgba(20,14,6,.55);display:flex;align-items:center;justify-content:center;padding:12px}
.ds-sozlesme{background:#fff;border-radius:18px;width:100%;max-width:640px;height:min(92vh,900px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.ds-sozlesme-bas{padding:18px 20px 12px;border-bottom:1px solid var(--ds-line)}
.ds-sozlesme-govde{flex:1;overflow:auto;padding:14px 20px 20px;-webkit-overflow-scrolling:touch}
.ds-sozlesme-metin{font-size:12.5px;line-height:1.6;color:var(--ds-ink7,#3a332b)}
.ds-sozlesme-metin h3{font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--ds-ink);margin:16px 0 6px}
.ds-sozlesme-metin p{margin:0 0 8px;text-align:justify}
.ds-sozlesme-metin ol{padding-left:20px;margin:0}
.ds-sozlesme-metin li{margin-bottom:6px;text-align:justify}
.ds-sozlesme-form{display:flex;flex-direction:column;gap:2px;padding:12px;margin:4px 0 8px;border:1px solid var(--ds-goldline);border-radius:12px;background:var(--ds-goldbg)}
.ds-sozlesme-form textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--ds-line);border-radius:10px;resize:vertical}
.ds-sozlesme-son{text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ds-ink5);padding:14px 0 4px}
.ds-sozlesme-alt{padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--ds-line);background:#fff}
.ds-sozlesme-alt a{color:var(--ds-gold7)}
.ds-sozlesme-kabul input:disabled+span{opacity:.55}
#sz-onay:disabled{opacity:.4;cursor:not-allowed}
.ds-sozlesme .ds-form-hata{color:#A2463B;font-size:12.5px;margin:0 0 8px}
/* QR ile giriş */
.ds-qr-kart{display:flex;flex-direction:column;gap:12px;border-color:var(--ds-goldline) !important;background:var(--ds-goldbg) !important}
.ds-qr-kart b{display:block;font-size:14.5px;font-weight:600;color:var(--ds-ink)}
.ds-qr-kart small{display:block;font-size:12px;line-height:1.55;color:var(--ds-ink5);margin-top:3px}
.ds-qr-kart .btn{width:100%}
.ds-qr-tamam{flex-direction:row;align-items:center;background:#F2F6F0 !important;border-color:#D3E0CF !important}
.ds-qr-tamam>.ds-ic{font-size:26px;color:#4A6645;flex:none}
.ds-qr-sonuc{display:flex;justify-content:center;align-items:center;height:64px;margin:4px 0 8px}
.ds-qr-sonuc>.ds-ic{font-size:46px;color:#A2463B}
.ds-qr-ok>.ds-ic{color:#4A6645}
.ds-qr-kamera{position:relative;border-radius:16px;overflow:hidden;background:#111;aspect-ratio:1/1}
.ds-qr-kamera video{width:100%;height:100%;object-fit:cover;display:block}
.ds-qr-kamera i{position:absolute;inset:18%;border:2px solid rgba(212,175,55,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
/* Bildirimler */
#bildirim-btn{position:relative}
.ds-sayi{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ds-ink);color:var(--gold-light);font:600 10.5px/18px 'Jost',sans-serif;text-align:center}
.ds-bildirimler{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.ds-bildirim{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;border:1px solid var(--ds-line);border-radius:12px;background:#fff;cursor:pointer;font-family:inherit;color:var(--ds-ink)}
.ds-bildirim .ds-ic{color:var(--ds-gold6);font-size:18px;margin-top:1px}
.ds-bildirim b{display:block;font-weight:500;font-size:14px}
.ds-bildirim small{display:block;font-size:12px;color:var(--ds-ink5);margin-top:2px;line-height:1.45}
.ds-bildirim.yeni{border-color:var(--ds-goldline);background:var(--ds-goldbg)}
</style>
</head>

// Kurallar yönetici panelindeki "dikkat" listesiyle aynıdır; panel her açıldığında bir kez gösterilir.
function odemeDurumu(o){
  if(o.odeme_bekliyor)return null; // ödeme bildirimi yapılmış, stüdyo onayı bekleniyor
  const toplam=o.toplam_paket||o.paket||20;
  const kalan=Math.max(0,toplam-(o.yapilan||0));
  const efektif=kalan-(o.borc||0);
  const bit=(o.baslangic&&o.gunler&&o.gunler.length)?bitis(o):null;
  const kalanGunS=bit?Math.ceil((bit-new Date())/864e5):null;
  if(o.ilk_odeme_alindi===false)return{tip:'gecikme',baslik:'Ödemeniz bekleniyor',metin:'Paket ödemeniz henüz stüdyoya ulaşmadı. Ödemeyi yaptıysanız "Ödeme Yaptım" ile bildirebilirsiniz.'};
  if((o.borc||0)>0)return{tip:'gecikme',baslik:'Ders borcunuz var',metin:o.borc+' ders borcunuz bulunuyor. Yeni paket ödemesiyle kapatılabilir.'};
  if(kalan===0)return{tip:'gecikme',baslik:'Paketiniz tamamlandı',metin:'Tüm derslerinizi kullandınız. Derslerinize devam etmek için yeni paket ödemesi gerekiyor.'};
  if(bit&&kalanGunS<0)return{tip:'gecikme',baslik:'Paket süreniz doldu',metin:'Paketinizin süresi '+bit.toLocaleDateString('tr-TR')+' tarihinde doldu. Yenileme için stüdyomuzla görüşebilirsiniz.'};
  if(efektif<=3)return{tip:'yaklasan',baslik:'Yeni paket ödemesi yaklaşıyor',metin:'Son '+efektif+' dersiniz kaldı. Paketinizi yenilemek için ödeme bilgilerine göz atabilirsiniz.'};
  if(bit&&kalanGunS<=5)return{tip:'yaklasan',baslik:'Paketiniz bitmek üzere',metin:'Paketiniz '+(kalanGunS===0?'bugün':kalanGunS+' gün sonra')+' ('+bit.toLocaleDateString('tr-TR')+') sona eriyor.'};
  return null;
}

let ykKayit=[],talepKayit=[],odemeKayit=[],takip=null,katilimlar=[],tatilSet={},aktifBulten=0,davetOdul=[],davetSayisi=0,qrAcik=false;
const DAVET_INDIRIMI_YUZDE=10;
const ROZETLER=[1,10,25,50,75,100,150,200,300];
const YK_ETIKET={geldi:['Katıldınız','yesil'],gelmedi:['Katılmadınız','kirmizi'],iptal:['İptal (hak kullanıldı)','gri'],studyo_iptal:['Stüdyo iptali','gri'],ertelendi:['Ertelendi','altin'],telafi:['Telafi dersi','altin']};
function tStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function tEkle(s,n){const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return tStr(d);}
function tTR(s){return s?new Date(s+(String(s).length===10?'T12:00':'')).toLocaleDateString('tr-TR'):'—';}
function gunUzun(s){return ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'][new Date(s+'T12:00').getDay()];}
function kac(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function tl(n){return '₺'+Math.round(n||0).toLocaleString('tr-TR');}
function kalanIptalHakki(o){return Math.max(0,(o.iptal_hakki??1)-(o.iptal_gecmisi||[]).filter(t=>!o.baslangic||t>=o.baslangic).length);}

async function ogrEkYukle(){
  if(!OGR)return;
  const bas=tEkle(bugun(),-120);
  const r=await Promise.all([
    sb.from('yoklama').select('*').eq('ogrenci_id',OGR._id).gte('tarih',bas).order('tarih',{ascending:false}),
    sb.from('ders_talepleri').select('*').eq('ogrenci_id',OGR._id).order('created_at',{ascending:false}).limit(30),
    sb.from('gelir_gider').select('tarih,tutar,acik').eq('ogrenci_id',OGR._id).eq('tip','gelir').order('tarih',{ascending:false}),
    sb.from('ogrenci_takip').select('*').eq('ogrenci_id',OGR._id).maybeSingle(),
    sb.from('etkinlik_katilim').select('etkinlik').eq('ogrenci_id',OGR._id),
    sb.from('tatiller').select('tarih,ad').gte('tarih',tEkle(bugun(),-1)),
    sb.from('bultenler').select('id',{count:'exact',head:true}).gte('olusturulma',new Date(Date.now()-864e5).toISOString()),
    sb.from('davet_odulleri').select('*').order('verilis',{ascending:false}),
    sb.from('davet_kod_gecmisi').select('id',{count:'exact',head:true}),
    sb.rpc('qr_giris_acik')
  ].map(p=>p.then(x=>x,e=>({error:e}))));
  if(!r[0].error)ykKayit=r[0].data||[];
  if(!r[1].error)talepKayit=r[1].data||[];
  if(!r[2].error)odemeKayit=r[2].data||[];
  if(!r[3].error)takip=r[3].data||null;
  if(!r[4].error)katilimlar=(r[4].data||[]).map(x=>x.etkinlik);
  if(!r[5].error){tatilSet={};(r[5].data||[]).forEach(x=>tatilSet[x.tarih]=x.ad);}
  if(!r[6].error)aktifBulten=r[6].count||0;
  if(!r[7].error)davetOdul=r[7].data||[];
  if(r[8]&&!r[8].error)davetSayisi=r[8].count||0;
  if(r[9]&&!r[9].error)qrAcik=r[9].data===true;
  bildirimRozeti();
}

function takipBirlestir(){
  const t=takip||{};
  const su={...(t.su||{})};
  Object.entries(suData||{}).forEach(([k,v])=>{if(!(su[k]>=v))su[k]=v;});
  suData=su;localStorage.setItem('su_'+OGR._id,JSON.stringify(suData));bugunSu=suData[bugun()]||0;
  if(t.su_hedef&&!localStorage.getItem('su_h_'+OGR._id))localStorage.setItem('su_h_'+OGR._id,t.su_hedef);
  if(t.kalori_hedef&&!localStorage.getItem('kalori_h_'+OGR._id))localStorage.setItem('kalori_h_'+OGR._id,t.kalori_hedef);
  if(t.dongu_rizasi&&t.dongu){
    const bas=[...new Set([...(t.dongu.bas||[]),...(donguData.bas||[])])].sort().slice(-24);
    donguData={bas,uzunluk:donguData.uzunluk||t.dongu.uzunluk||28};
    localStorage.setItem('dongu_'+OGR._id,JSON.stringify(donguData));
  }
  takipKaydet();
}

    const {data:d,error}=await sb.from('ogrenci_takip').upsert(kayit).select().maybeSingle();
    if(!error&&d)takip=d;
  },700);

// ── DERSLER: yaklaşan dersler, gelemeyeceğim talebi, geçmiş ──
function yaklasanDersler(gunSayisi){
  const o=OGR;const liste=[];const bugunS=bugun();
  let kalan=Math.max(0,kalanDers(o));
  for(let k=0;k<gunSayisi;k++){
    const t=tEkle(bugunS,k);const dow=new Date(t+'T12:00').getDay();
    const yk=ykKayit.find(y=>y.tarih===t);
    if(yk&&yk.durum==='telafi'){liste.push({t,yk});continue;}
    if(!(o.gunler||[]).includes(dow)||tatilSet[t])continue;
    if(o.baslangic&&t<o.baslangic)continue;
    if(yk){liste.push({t,yk});if(yk.sayim!=='yok')kalan--;continue;}
    if(kalan<=0)break;
    liste.push({t});kalan--;
  }
  return liste;
}

// ── ÖLÇÜM GRAFİKLERİ: her ölçü için ayrı küçük çizgi grafik ──
function cizgiGrafik(olcumler,alan,baslik,birim){
  const n=olcumler.filter(o=>o[alan]!=null&&o[alan]!=='').map(o=>({t:o.tarih,v:+o[alan]}));
  if(n.length<2)return '';
  const G=300,Y=120,sol=8,sag=8,ust=22,alt=22;
  const vs=n.map(x=>x.v);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx-mn<1){mn-=0.5;mx+=0.5;}
  const x=k=>sol+(G-sol-sag)*(n.length===1?0.5:k/(n.length-1));
  const y=v=>ust+(Y-ust-alt)*(1-(v-mn)/(mx-mn));
  const yol=n.map((p,k)=>(k?'L':'M')+x(k).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const fark=(n[n.length-1].v-n[0].v);
  const fmt=v=>v.toLocaleString('tr-TR',{maximumFractionDigits:1});
  return '<figure class="ds-grafik"><figcaption><span class="ds-eyebrow">'+baslik+'</span><span class="ds-kucuk">'+(fark>0?'+':'')+fmt(fark)+' '+birim+' · '+n.length+' ölçüm</span></figcaption>'
    +'<svg viewBox="0 0 '+G+' '+Y+'" role="img" aria-label="'+baslik+': '+n.map(p=>tTR(p.t)+' '+fmt(p.v)+' '+birim).join(', ')+'">'
    +'<line x1="'+sol+'" x2="'+(G-sag)+'" y1="'+(Y-alt)+'" y2="'+(Y-alt)+'" class="ds-g-taban"/>'
    +'<path d="'+yol+'" class="ds-g-cizgi"/>'
    +n.map((p,k)=>'<g class="ds-g-nokta" tabindex="0"><circle cx="'+x(k)+'" cy="'+y(p.v)+'" r="14" class="ds-g-hedef"/><circle cx="'+x(k)+'" cy="'+y(p.v)+'" r="4.5"/><title>'+tTR(p.t)+': '+fmt(p.v)+' '+birim+'</title>'
      +'<text x="'+Math.min(G-sag-4,Math.max(sol+4,x(k)))+'" y="'+(y(p.v)-10)+'" text-anchor="'+(k===0?'start':k===n.length-1?'end':'middle')+'" class="ds-g-deger'+(k===0||k===n.length-1?' hep':'')+'">'+fmt(p.v)+'</text></g>').join('')
    +'<text x="'+sol+'" y="'+(Y-6)+'" class="ds-g-eksen">'+tTR(n[0].t)+'</text><text x="'+(G-sag)+'" y="'+(Y-6)+'" text-anchor="end" class="ds-g-eksen">'+tTR(n[n.length-1].t)+'</text>'
    +'</svg></figure>';
}

// ── DAVET ÖDÜLÜ: arkadaşı ilk ödemesini yapınca davet edene 30 gün geçerli %10 indirim hakkı ──
function odulAktif(x){return x.durum==='aktif'&&new Date(x.bitis)>new Date();}
function odulTutari(x){return Math.round((OGR.ucret||0)*(+x.oran||DAVET_INDIRIMI_YUZDE/100));}
function tarihKisa(ts){return new Date(ts).toLocaleDateString('tr-TR',{day:'numeric',month:'long'});}
// Bir sonraki paket ödemesinde ödenecek tutar: davetle gelen üyenin ilk paket indirimi ve kullanılan davet indirimi düşülür.
function odenecekTutar(){
  const u=+(OGR&&OGR.ucret)||0;let ind=0;const n=[];
  if(OGR&&OGR.ilk_odeme_alindi===false&&OGR.davet_eden){const x=Math.round(u*DAVET_INDIRIMI_YUZDE/100);ind+=x;n.push('Davetle ilk paket indirimi');}
  const bek=davetOdul.filter(x=>x.durum==='kullanildi'&&+x.kalan>0).reduce((t,x)=>t+(+x.kalan),0);
  if(bek>0){const x=Math.min(bek,u-ind);ind+=x;n.push('Davet indiriminiz');}
  return {tutar:u-ind,indirim:ind,not:n.join(' + ')};
}
function indirimSatiri(kucuk){
  const t=odenecekTutar();if(!t.indirim)return '';
  return '<div class="ds-indirimli'+(kucuk?' ds-indirimli-k':'')+'"><s>'+tl(OGR.ucret)+'</s> '+kac(t.not)+' −'+tl(t.indirim)+'</div>';
}
function davetOdulHtml(){
  const satirlar=[];
  davetOdul.forEach(x=>{
    if(odulAktif(x)){
      const gun=Math.max(0,Math.ceil((new Date(x.bitis)-Date.now())/864e5));
      satirlar.push('<div class="ds-odul ds-odul-aktif"><div><b>%'+Math.round((+x.oran||0.1)*100)+' indirim hakkı kazandınız</b>'
        +'<small>Davet ettiğiniz arkadaşınız aramıza katıldı. '+tarihKisa(x.bitis)+' tarihine kadar ('+gun+' gün) kullanabilirsiniz.</small></div>'
        +'<button class="btn btn-primary" onclick="davetIndirimiUygula(\''+x.id+'\')">%'+Math.round((+x.oran||0.1)*100)+' İndirimi Uygula · '+tl(odulTutari(x))+'</button></div>');
    }else if(x.durum==='kullanildi'){
      const parca=[];
      if(+x.borca_yansiyan>0)parca.push(tl(x.borca_yansiyan)+' kalan ödemenizden düşüldü');
      if(+x.kalan>0)parca.push(tl(x.kalan)+' bir sonraki paket ödemenizde düşülecek');
      else if(x.mahsup_tarihi&&!(+x.borca_yansiyan>0))parca.push(tl(x.tutar)+' '+tarihKisa(x.mahsup_tarihi)+' tarihli ödemenizde uygulandı');
      if(parca.length&&(+x.kalan>0||Date.now()-new Date(x.kullanim)<60*864e5))
        satirlar.push('<div class="ds-odul"><div><b>Davet indiriminiz kullanıldı</b><small>'+parca.join('; ')+'.</small></div></div>');
    }
  });
  // Sıradaki haklar: her ay bir hak aktif olur (bir önceki hakkın aktif olduğu tarihten bir ay sonra)
  const sira=davetOdul.filter(x=>x.durum==='sirada');
  if(sira.length){
    const acilan=davetOdul.filter(x=>x.durum!=='sirada'&&x.verilis).map(x=>new Date(x.verilis));
    let sonraki=acilan.length?new Date(Math.max(...acilan)):new Date();
    if(acilan.length)sonraki.setMonth(sonraki.getMonth()+1);
    davetOdul.filter(odulAktif).forEach(x=>{const b=new Date(x.bitis);if(b>sonraki)sonraki=b;});
    if(sonraki<new Date())sonraki=new Date(Date.now()+864e5);
    satirlar.push('<div class="ds-odul"><div><b>Sırada '+sira.length+' indirim hakkınız var</b><small>Aynı ay içinde birden fazla arkadaşınızı getirdiniz, teşekkür ederiz! Her ay bir indirim hakkınız aktif olur. Sıradaki hakkınız yaklaşık '+tarihKisa(sonraki)+' tarihinde aktif olacak ve o günden itibaren 30 gün geçerli olacak.</small></div></div>');
  }
  return satirlar.join('');
}

let QR_BEKLEYEN=null;
try{const k=new URLSearchParams(location.search).get('giris');if(k){QR_BEKLEYEN=k;history.replaceState(null,'',location.pathname);}}catch(e){}

function bugunDers(){return yaklasanDersler(1).find(x=>x.t===bugun())||null;}

    +'<button class="btn btn-primary" onclick="qrOkut()">'+dsIc('target')+' QR okut</button></div>';

function qrSonucGoster(ok,baslik,metin){
  ogrPencere('<div class="ds-qr-sonuc'+(ok?' ds-qr-ok':'')+'">'+dsIc(ok?'check':'warn')+'</div><div class="ds-pencere-baslik" style="text-align:center">'+kac(baslik)+'</div>'
    +'<div class="ds-kucuk" style="text-align:center;margin-bottom:16px;line-height:1.6">'+kac(metin)+'</div><div class="ds-pencere-btn"><button class="btn btn-primary" data-kapat="1" style="width:100%">Tamam</button></div>');
}
function konumAl(){
  return new Promise((coz,red)=>{
    if(!navigator.geolocation)return red(new Error('Telefonunuz konum bilgisini desteklemiyor.'));
    navigator.geolocation.getCurrentPosition(p=>coz(p.coords),e=>red(new Error(e.code===1
      ?'Konum izni verilmedi. Girişin stüdyoda yapıldığını doğrulamak için konum izni gerekiyor. Tarayıcı ayarlarından bu site için konum iznini açıp tekrar deneyin.'
      :'Konumunuz alınamadı. Konum servisinin açık olduğundan emin olup tekrar deneyin.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
  });
}
async function qrGirisGonder(kod){
  const bekle=ogrPencere('<div class="ds-qr-sonuc"><div class="spinner"></div></div><div class="ds-pencere-baslik" style="text-align:center">Girişiniz kontrol ediliyor</div><div class="ds-kucuk" style="text-align:center">Stüdyoda olduğunuzu doğrulamak için konumunuz alınıyor. Konumunuz kaydedilmez.</div>');
  try{
    const c=await konumAl();
    const {data,error}=await sb.rpc('qr_giris',{p_kod:kod,p_lat:c.latitude,p_lng:c.longitude,p_dogruluk:c.accuracy});
    if(error)throw error;
    bekle.remove();
    const ok=data.sonuc==='tamam'||data.sonuc==='zaten';
    qrSonucGoster(ok,ok?'Hoş geldiniz!':'Giriş alınamadı',data.mesaj);
    if(ok){await ogrEkYukle();const a=document.querySelector('.page.active')?.id?.replace('pg-','');sp(a||'ana');}
  }catch(e){bekle.remove();qrSonucGoster(false,'Giriş alınamadı',e.message);}
}
function jsQRYukle(){
  if(window.jsQR)return Promise.resolve();
  return new Promise((coz,red)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';s.onload=coz;s.onerror=()=>red(new Error('QR okuyucu yüklenemedi. İnternet bağlantınızı kontrol edin.'));document.head.appendChild(s);});
}
async function qrOkut(){
  const ov=ogrPencere('<div class="ds-pencere-baslik" style="text-align:center">QR kodu okutun</div><div class="ds-kucuk" style="text-align:center;margin-bottom:12px">Kamerayı stüdyo girişindeki QR afişine tutun.</div>'
    +'<div class="ds-qr-kamera"><video playsinline muted></video><i></i></div><div class="ds-pencere-btn" style="margin-top:14px"><button class="btn" data-kapat="1" style="width:100%">Vazgeç</button></div>');
  let akis=null,bitti=false;
  const dur=()=>{bitti=true;if(akis)akis.getTracks().forEach(t=>t.stop());};
  new MutationObserver((m,obs)=>{if(!document.body.contains(ov)){dur();obs.disconnect();}}).observe(document.body,{childList:true});
  try{
    await jsQRYukle();
    akis=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v=ov.querySelector('video');v.srcObject=akis;await v.play();
    const cv=document.createElement('canvas');const cx=cv.getContext('2d',{willReadFrequently:true});
    const tara=()=>{
      if(bitti)return;
      if(v.readyState>=2&&v.videoWidth){
        cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
        const q=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});
        if(q&&q.data){
          let kod=q.data;try{const u=new URL(q.data);kod=u.searchParams.get('giris')||'';}catch(e){}
          if(kod){dur();ov.remove();qrGirisGonder(kod);return;}
        }
      }
      requestAnimationFrame(tara);
    };
    tara();
  }catch(e){
    dur();ov.remove();
    qrSonucGoster(false,'Kamera açılamadı',e.name==='NotAllowedError'
      ?'Kamera izni verilmedi. İsterseniz telefonunuzun kamera uygulamasıyla afişteki QR kodu okutabilirsiniz; açılan sayfa girişinizi alır.'
      :e.message||'Kamera başlatılamadı. Telefonunuzun kamera uygulamasıyla afişteki QR kodu okutmayı deneyin.');
  }
}

async function ogrBultenYukle(){
  if(!OGR||!OGR._id)return;
  const el=document.getElementById('bulten-alan');
  if(!el)return;
  try{
    const [tumRes,kisiRes]=await Promise.all([
      sb.from('bultenler').select('*').eq('hedef_tip','tumu').order('olusturulma',{ascending:false}),
      sb.from('bultenler').select('*').eq('ogrenci_id',OGR._id).order('olusturulma',{ascending:false})
    ]);
    if(tumRes.error)console.error('Bulten (tumu) yuklenemedi:',tumRes.error.message);
    if(kisiRes.error)console.error('Bulten (kisisel) yuklenemedi:',kisiRes.error.message);
    const rows=[...(tumRes.data||[]),...(kisiRes.data||[])];
    if(!rows.length){el.innerHTML='';return;}
    const now=Date.now();
    const aktif=rows.filter(function(r){return now-new Date(r.olusturulma).getTime()<24*3600*1000;});
    if(!aktif.length){el.innerHTML='';return;}
    el.innerHTML=aktif.map(function(r){
      const kalan=Math.max(0,Math.round(24-(now-new Date(r.olusturulma).getTime())/3600000));
      const guvenliIcerik=r.icerik.replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const guvenliBaslik=r.baslik.replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return '<div class="card" style="padding:16px;margin-bottom:14px">'
        +'<div class="ds-kart-bas">'+dsIc(/men[üu]/i.test(r.baslik)?'uten':'megaphone')+'<span class="ds-eyebrow">'+guvenliBaslik+'</span></div>'
        +'<div style="font-size:14px;color:var(--ds-ink7);line-height:1.7;white-space:pre-line">'+guvenliIcerik+'</div>'
        +'<div style="margin-top:10px;font-size:11px;color:var(--ds-ink3)">Merve Hoca\'dan · '+kalan+' saat daha görünür</div>'
        +'</div>';
    }).join('');
  }catch(e){el.innerHTML='';}
}

function setHedef(h){localStorage.setItem('su_h_'+OGR._id,h);takipKaydet();renderSu();}
function suEkle(ml){bugunSu+=ml;if(!OGR)return;suData[bugun()]=bugunSu;localStorage.setItem('su_'+OGR._id,JSON.stringify(suData));takipKaydet();renderSu();renderAna();}
function suSifirla(){bugunSu=0;if(!OGR)return;suData[bugun()]=0;localStorage.setItem('su_'+OGR._id,JSON.stringify(suData));takipKaydet();renderSu();renderAna();}
function setKaloriHedef(h){localStorage.setItem('kalori_h_'+OGR._id,h);takipKaydet();renderSu();}
function kaloriEkle(kc){
  bugunKalori+=kc;if(!OGR)return;
  kaloriData[bugun()]=bugunKalori;
  localStorage.setItem('kalori_'+OGR._id,JSON.stringify(kaloriData));
  renderSu();
  sb.from('kalori_kayitlari').upsert({ogrenci_id:OGR._id,tarih:bugun(),kalori:bugunKalori,guncelleme:new Date().toISOString()},{onConflict:'ogrenci_id,tarih'}).then(function(){});
}
function kaloriSifirla(){
  bugunKalori=0;if(!OGR)return;
  kaloriData[bugun()]=0;

function donguDurum(){
  const bas=donguData.bas||[];
  if(!bas.length)return{baslik:'Henüz kayıt yok',aciklama:'Döngünüzü başlatmak için butona basın',badge:'b-blue',gun:'—'};
  const son=new Date(bas[bas.length-1]);
  const gecen=Math.floor((new Date()-son)/864e5)+1;
  const uzunluk=donguData.uzunluk||28;
  const gun=((gecen-1)%uzunluk)+1;
  if(gun<=5)return{baslik:'Regl Dönemi',aciklama:gun+'. gün',badge:'b-pink',gun:gun+'. gün'};
  if(gun<=13)return{baslik:'Foliküler Dönem',aciklama:'Enerji artıyor!',badge:'b-green',gun:gun+'. gün'};
  if(gun===14)return{baslik:'Ovülasyon',aciklama:'Zirve enerji günü! 🌟',badge:'b-yellow',gun:'Ovülasyon'};
  return{baslik:'Luteal Dönem',aciklama:(uzunluk-gun+1)+' gün sonra yeni döngü',badge:'b-purple',gun:gun+'. gün'};
}
