<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DUMAN STUDIO — Öğrenci</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>

:root{
  --bg:#FAF7F0;--bg2:#F5F0E8;--bg3:#EDE8DC;
  --card:#FFFFFF;--card2:#FDF9F3;
  --border:#E8DFD0;--border2:#D4C8B0;
  --text:#2A2015;--text2:#6B5A3A;--text3:#A89070;
  --gold:#D2A941;--gold-light:#F0DC92;--gold-dark:#946C18;
  --gold-bg:rgba(210,169,65,.1);--gold-border:rgba(148,108,24,.25);
  --green:#5A8A5A;--green-bg:rgba(90,138,90,.1);--green-border:rgba(90,138,90,.25);
  --red:#C0302C;--red-bg:rgba(192,48,44,.1);--red-border:rgba(192,48,44,.25);
  --yellow:#D2A941;--yellow-bg:rgba(210,169,65,.1);--yellow-border:rgba(210,169,65,.25);
  --blue:#5A7A9A;--blue-bg:rgba(90,122,154,.1);--blue-border:rgba(90,122,154,.25);
  --purple:#8A6A9A;--purple-bg:rgba(138,106,154,.1);--purple-border:rgba(138,106,154,.25);
  --pink:#C07A90;--pink-bg:rgba(192,122,144,.1);--pink-border:rgba(192,122,144,.25);
  --pilates:#946C18;--ems:#D2A941;
  --cream:#F9EFBD;--warm:#F0DC92;
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
  --shadow:0 2px 12px rgba(148,108,24,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;width:100%;margin:0;padding:0;overflow:hidden;-webkit-font-smoothing:antialiased}

/* LOGIN */
.login-wrap{width:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:380px}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo-icon{width:72px;height:72px;background:linear-gradient(135deg,var(--gold-dark),var(--gold));border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px}
.login-logo h1{font-size:24px;font-weight:800;background:linear-gradient(90deg,var(--gold),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.login-logo p{font-size:13px;color:var(--text2);margin-top:4px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px}
.login-card label{font-size:13px;color:var(--text2);display:block;margin-bottom:6px}
.login-card input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-size:16px;outline:none;margin-bottom:16px}
.login-card input:focus{border-color:var(--pilates)}
.btn-login{width:100%;padding:13px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--gold-dark),var(--gold));color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
.login-error{color:var(--red);font-size:13px;text-align:center;margin-top:8px;display:none}

/* HEADER */
.app-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.app-logo{width:32px;height:32px;background:white;border:1px solid var(--border2);overflow:hidden;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff}
.app-title{font-size:15px;font-weight:700;background:linear-gradient(90deg,var(--gold),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.app-sub{font-size:11px;color:var(--text2);margin-top:1px}
.header-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--purple-bg);border:1px solid var(--purple-border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--purple)}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:50;padding:0 4px}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;cursor:pointer;color:var(--text3);border:none;background:transparent;font-size:10px}
.nav-btn.active{color:var(--gold-dark);font-weight:600}
.nav-icon{font-size:20px}

/* PAGES */
.page{display:none;padding:16px;max-width:600px;margin:0 auto}
.page.active{display:block}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.section-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}

/* METRICS */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.metric-val{font-size:26px;font-weight:800;margin-bottom:2px}
.metric-lbl{font-size:11px;color:var(--text2)}

/* PROGRESS */
.pbar{height:8px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-top:8px}
.pfill{height:100%;border-radius:99px;transition:width .5s ease}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600}
.b-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.b-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.b-yellow{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.b-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.b-purple{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.b-pink{background:var(--pink-bg);color:var(--pink);border:1px solid var(--pink-border)}
.b-pilates{background:var(--green-bg);color:var(--pilates)}
.b-ems{background:var(--purple-bg);color:var(--ems)}

/* ALERTS */
.alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:8px;line-height:1.5}
.a-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.a-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.a-yellow{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.a-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.a-purple{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.a-pink{background:var(--pink-bg);color:var(--pink);border:1px solid var(--pink-border)}

/* BUTTONS */
.btn{padding:10px 18px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:13px;font-weight:600}
.btn-primary{background:linear-gradient(135deg,#975B09,var(--gold-dark),var(--gold));color:white;border:none;font-weight:600;box-shadow:0 3px 10px rgba(148,108,24,.25)}
.btn-ghost{background:var(--card2);color:var(--text2)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card2);color:var(--text2);cursor:pointer;font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.flex1{flex:1}
.divider{border:none;border-top:1px solid var(--border);margin:10px 0}

/* SU TAKİBİ */
.water-circle{width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--blue) var(--pct,0%), var(--bg3) var(--pct,0%));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;position:relative}
.water-inner{width:110px;height:110px;border-radius:50%;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.water-val{font-size:24px;font-weight:800;color:var(--blue)}
.water-lbl{font-size:11px;color:var(--text2)}
.water-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.water-btn{padding:8px 16px;border-radius:99px;border:1px solid var(--blue-border);background:var(--blue-bg);color:var(--blue);cursor:pointer;font-size:13px;font-weight:700}
.water-btn:active{background:var(--blue);color:#fff}

/* ADET DÖNGÜSÜ */
.cycle-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0}
.cycle-day{aspect-ratio:1;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;font-weight:600;background:var(--card2);color:var(--text2)}
.cycle-day.period{background:var(--pink-bg);border-color:var(--pink-border);color:var(--pink)}
.cycle-day.fertile{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
.cycle-day.ovulation{background:var(--yellow-bg);border-color:var(--yellow-border);color:var(--yellow)}
.cycle-day.today{border-color:var(--purple);border-width:2px}
.cycle-day.future{opacity:.4}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}

/* ÖDEME */
.odeme-card{background:linear-gradient(135deg,rgba(29,185,122,.15),rgba(139,92,246,.1));border:1px solid var(--green-border);border-radius:var(--radius-lg);padding:20px;text-align:center;margin-bottom:16px}
.odeme-tutar{font-size:36px;font-weight:800;color:var(--green);margin:8px 0}

/* LOADING */
.loading-wrap{position:fixed;inset:0;background:rgba(15,15,26,.8);z-index:200;display:flex;align-items:center;justify-content:center;display:none}
.loading-spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--pilates);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* DERS KARTLARI */
.ders-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.ders-item:last-child{border-bottom:none}
.ders-gun{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--bg3);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.ders-gun-text{font-size:10px;color:var(--text3)}
.ders-gun-num{font-size:14px;font-weight:700;color:var(--text)}

/* MOTIVASYON */
.motivasyon{background:linear-gradient(135deg,rgba(29,185,122,.1),rgba(139,92,246,.1));border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;font-size:13px;color:var(--text2);line-height:1.6;font-style:italic}

/* ── RESPONSIVE DESKTOP ── */
@media(min-width:768px){
  body{background:#EDE8DC;margin:0;padding:0}
  #main-app{
    max-width:1400px;
    margin:0 auto;
    background:var(--bg);
    box-shadow:0 0 40px rgba(148,108,24,.08);
    height:100vh;
    overflow:hidden;
    grid-template-columns:200px 1fr;
    grid-template-rows:52px 1fr;
  }
  #main-app.show{display:grid !important}
  .top-bar{
    grid-column:1/-1;
    grid-row:1;
    padding:0 20px;
    border-bottom:0.5px solid var(--border);
    background:var(--bg);
    height:52px;
    display:flex;
    align-items:center;
    z-index:100;
  }
  .side-nav-desk{
    display:flex !important;
    grid-row:2;
    grid-column:1;
    overflow-y:auto;
    flex-direction:column;
    border-right:0.5px solid var(--border);
    background:var(--bg);
    padding:10px 8px;
    gap:1px;
  }
  .main-pages{
    grid-row:2;
    grid-column:2;
    overflow-y:auto;
    height:calc(100vh - 52px);
  }
  .bottom-nav{display:none !important}
  .page{padding-bottom:0 !important}
  .main-pages{scrollbar-width:thin}
  #login-screen{
    position:fixed;top:0;left:0;
    width:100vw;height:100vh;z-index:9998;
  }
}
@media(min-width:1200px){
  #app.show{grid-template-columns:200px 1fr}
}

.side-nav-btn{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:var(--radius-sm);
  background:transparent;border:none;cursor:pointer;
  color:var(--text2);font-size:13px;font-weight:500;
  text-align:left;width:100%;transition:all .15s;
}
.side-nav-btn:hover{background:var(--card2);color:var(--text)}
.side-nav-btn.active{background:var(--gold-bg);color:var(--gold-dark);font-weight:600}

/* ── SIDE NAV DESKTOP ── */
.side-nav-desk{display:none;}
.snav-btn-d{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:9px;
  background:transparent;border:none;
  cursor:pointer;color:var(--text2);
  font-size:13px;font-weight:500;
  text-align:left;width:100%;
  transition:all .15s;white-space:nowrap;
}
.snav-btn-d:hover{background:var(--card2);color:var(--text)}
.snav-btn-d.act{background:#F9EFBD;color:#946C18;font-weight:600;border-left:2.5px solid #946C18;padding-left:10px}
.snav-sec{font-size:8px;color:#A89070;letter-spacing:1.5px;padding:10px 12px 4px;text-transform:uppercase;font-weight:500}
.snav-sec{font-size:8px;color:var(--text3);letter-spacing:1.5px;
  padding:10px 12px 4px;text-transform:uppercase}
.main-pages{flex:1;overflow-y:auto}

/* ── RESPONSIVE - STÜDYO GİBİ ── */
@media(min-width:768px){
  body{background:#EDE8DC}
  #main-app{
    max-width:1400px;
    margin:0 auto;
    background:var(--bg);
    box-shadow:0 0 40px rgba(148,108,24,.08);
    height:100vh;
    overflow:hidden;
    grid-template-columns:200px 1fr;
    grid-template-rows:52px 1fr;
  }
  #main-app.show{display:grid !important}
  .top-bar{
    grid-column:1/-1;
    grid-row:1;
    padding:0 20px;
  }
  .side-nav-desk{
    display:flex !important;
    grid-row:2;
    grid-column:1;
    overflow-y:auto;
    flex-direction:column;
    border-right:0.5px solid var(--border);
    background:var(--bg);
    padding:10px 8px;
    gap:1px;
    height:calc(100vh - 52px);
  }
  .main-pages{
    grid-row:2;
    grid-column:2;
    overflow-y:auto;
    height:calc(100vh - 52px);
  }
  .bottom-nav{display:none !important}
  .page{padding-bottom:0 !important}
  .main-pages{scrollbar-width:thin}
  #login-screen{
    position:fixed;top:0;left:0;
    width:100vw;height:100vh;z-index:9998;
  }
}
@media(min-width:1200px){
  #main-app{grid-template-columns:220px 1fr;max-width:1600px}
}


/* ── SAYFA WRAPPER ── */
.page-wrap{
  padding:20px 28px;
  width:100%;
  box-sizing:border-box;
}
@media(max-width:767px){
  .page-wrap{
    padding:14px 16px;
    padding-bottom:80px;
  }
}
.page-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}
@media(min-width:768px){
  .page-grid-2{
    grid-template-columns:1fr 300px;
  }
  .page-grid-3{
    grid-template-columns:1fr 1fr 1fr;
  }
}

/* Sayfa container'ları tam genişlik */
#derslerim-c, #su-c, #dongü-c, #odeme-c, #olcumlerim-c, #anasayfa-c {
  width: 100%;
  box-sizing: border-box;
}
@media(min-width:768px){
  #derslerim-c > div,
  #su-c > div,
  #dongü-c > div,
  #odeme-c > div,
  #olcumlerim-c > div {
    padding: 20px 28px !important;
    max-width: 100% !important;
    width: 100% !important;
  }
}
</style>
</head>

function rowToOgr(r){
  return {

}

function getBitis(o){const b=new Date(o.baslangic);b.setMonth(b.getMonth()+1);return b}
function kalanGun(o){return Math.ceil((getBitis(o)-new Date())/864e5)}
function kalanDers(o){return Math.max(0,(o.toplam_paket||o.paket||20)-(o.yapilan||0))}
function efektifKalan(o){return Math.max(0,kalanDers(o)-(o.borc||0))}
function pct(o){
  const top=o.toplam_paket||o.paket||20;
  // Mevcut paketteki ilerleme yüzdesi (yapilan / toplam_paket)
  return Math.min(100,Math.round(((o.yapilan||0)/top)*100));
}
function paketIlerleme(o){
  // Mevcut pakette kaç ders yapıldı
  const oncekiPaket=(o.toplam_paket||o.paket||20)-(o.paket||20);
  const buPakette=Math.max(0,(o.yapilan||0)-oncekiPaket);
  return {buPakette,paket:o.paket||20};
}
function barC(kd){return kd===0?'var(--red)':kd<=3?'var(--yellow)':'var(--green)'}
function ini(ad){return ad.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}

// ── GİRİŞ ──
async function girisYap(){
  const raw=document.getElementById('tel-input').value;
  // Tüm boşluk, tire, parantez kaldır
  const tel=raw.replace(/[\s\-\(\)]/g,'');
  if(!tel||tel.length<10){
    document.getElementById('login-error').style.display='block';
    document.getElementById('login-error').textContent='Geçerli bir telefon numarası girin.';
    return;
  }
  gosterLoading();
  try{
    // Farklı formatları dene: 05xx, 5xx, +905xx
    const formats=[
      tel,
      tel.startsWith('0')?tel.slice(1):('0'+tel),
      tel.startsWith('+90')?tel.slice(3):'+90'+tel.replace(/^0/,''),
      tel.startsWith('90')?tel.slice(2):'90'+tel.replace(/^0/,''),
    ];
    let found=null;
    for(const fmt of formats){
      const {data,error}=await sb.from('ogrenciler').select('*').eq('tel',fmt).single();
      if(!error&&data){found=data;break;}
    }
    if(!found){
      // ilike ile kısmi arama
      const digits=tel.replace(/\D/g,'').slice(-10);
      const {data:d2}=await sb.from('ogrenciler').select('*').ilike('tel','%'+digits+'%').limit(1);
      if(d2&&d2.length>0) found=d2[0];
    }
    if(!found){
      document.getElementById('login-error').style.display='block';
      document.getElementById('login-error').textContent='Bu numaraya kayıtlı öğrenci bulunamadı. ('+tel+')';
      gizleLoading();
      return;
    }
    ogrenci=rowToOgr(found);
    localStorage.setItem('ds_ogr_tel',tel);
    await baslat();
  }catch(e){
    document.getElementById('login-error').style.display='block';
    document.getElementById('login-error').textContent='Bağlantı hatası: '+e.message;
  }
  gizleLoading();
}

async function baslat(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-app').classList.add('show');
  // Header
  const headerSub=document.getElementById('header-sub');
  if(headerSub)headerSub.textContent=ogrenci.ad;
  const sideUserAd=document.getElementById('side-user-ad');
  if(sideUserAd)sideUserAd.textContent=ogrenci.ad;
  const avatarEl=document.getElementById('user-avatar'); if(avatarEl)avatarEl.textContent=ini(ogrenci.ad);
  // Yerel verileri yükle
  suData=JSON.parse(localStorage.getItem('ds_su_'+ogrenci._id)||'{}');
  donguData=JSON.parse(localStorage.getItem('ds_dongu_'+ogrenci._id)||'{"baslangiclar":[],"uzunluk":28}');
  bugunSu=suData[todayStr()]||0;
  sp('anasayfa');
}

function cikisYap(){

  const le=document.getElementById('login-error');
  if(le)le.style.display='none';
}

function renderSu(){
  const suHedef=getSuHedef();
  const yuzde=Math.min(100,Math.round(bugunSu/suHedef*100));
  const pctDeg=`${yuzde*3.6}deg`;

  let html=`<div style="padding:20px 28px;width:100%;box-sizing:border-box"><div style="font-size:18px;font-weight:700;color:#2A2015n-bottom:16px">💧 Su Takibi</div>`;

  // Çember
  html+=`<div class="card" style="text-align:center;padding:24px 16px">
    <div style="--pct:${pctDeg}" class="water-circle">
      <div class="water-inner">
        <div class="water-val">${bugunSu>=1000?(bugunSu/1000).toFixed(1)+'L':bugunSu+'ml'}</div>
        <div class="water-lbl">/ ${suHedef>=1000?(suHedef/1000).toFixed(1)+'L':suHedef+'ml'}</div>
      </div>
    </div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px">${
      yuzde>=100?'🎉 Günlük hedefinize ulaştınız!':
      yuzde>=75?'💪 Çok yaklaştınız, devam!':
      yuzde>=50?'🙂 Yarısını geçtiniz!':
      '💧 Su içmeye devam!'
    }</div>
    <div class="water-btns">
      <div class="water-btn" onclick="suEkle(150)">+150ml</div>
      <div class="water-btn" onclick="suEkle(200)">+200ml</div>
      <div class="water-btn" onclick="suEkle(250)">+250ml ☕</div>
      <div class="water-btn" onclick="suEkle(500)">+500ml 🍶</div>
    </div>
    ${bugunSu>0?`<button onclick="suSifirla()" style="margin-top:12px;background:transparent;border:none;color:var(--text3);font-size:12px;cursor:pointer">Sıfırla</button>`:''}
  </div>`;

  // Hedef ayarla
  html+=`<div class="section-title">⚙️ Günlük Hedef</div>
  <div class="card">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${[1500,2000,2500,3000].map(h=>`<button onclick="setHedef(${h})" class="btn-sm" style="${suHedef===h?'background:var(--blue);color:#fff;border-color:var(--blue)':''}">${h>=1000?(h/1000).toFixed(1)+'L':h+'ml'}</button>`).join('')}
    </div>
  </div>`;

  // Son 7 gün
  html+=`<div class="section-title">📊 Son 7 Gün</div>
  <div class="card">`;
  const maxSu=Math.max(suHedef,...Array.from({length:7},(_,i)=>{
    const d=new Date();d.setDate(d.getDate()-i);
    const k=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    return suData[k]||0;
  }));
  html+=`<div style="display:flex;align-items:flex-end;gap:4px;height:80px;margin-bottom:8px">`;
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const k=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const val=suData[k]||0;
    const h=maxSu>0?Math.round((val/maxSu)*70):0;
    const bugun=i===0;
    html+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
      <div style="width:100%;height:${h}px;min-height:2px;background:${val>=suHedef?'var(--blue)':'var(--blue-bg)'};border-radius:4px 4px 0 0;border:1px solid var(--blue-border)"></div>
      <div style="font-size:9px;color:${bugun?'var(--blue)':'var(--text3)'}">${GUNLER[d.getDay()]}</div>
    </div>`;
  }
  html+=`</div></div>`;

  document.getElementById('su-c').innerHTML=html+'</div>';
  // CSS değişkenini güncelle
  document.querySelectorAll('.water-circle').forEach(el=>{
    el.style.setProperty('--pct',pctDeg);
    el.style.background=`conic-gradient(var(--blue) ${pctDeg}, var(--bg3) ${pctDeg})`;
  });
}

function getSuHedef(){return parseInt(localStorage.getItem('ds_su_hedef_'+(ogrenci?._id||'x'))||'2000');}
function setHedef(h){localStorage.setItem('ds_su_hedef_'+(ogrenci?._id||'x'),h);renderSu();}
function suEkle(ml){
  bugunSu+=ml;
  if(!ogrenci)return;
  suData[todayStr()]=bugunSu;
  localStorage.setItem('ds_su_'+ogrenci._id,JSON.stringify(suData));
  renderSu();renderAnasayfa();
}
function suSifirla(){
  bugunSu=0;
  if(!ogrenci)return;
  suData[todayStr()]=0;
  localStorage.setItem('ds_su_'+ogrenci._id,JSON.stringify(suData));
  renderSu();renderAnasayfa();
}

// ── ADET DÖNGÜSÜ ──
function getDonguDurumu(){
  const bas=donguData.baslangiclar||[];
  if(!bas.length) return {baslik:'Henüz kayıt yok',aciklama:'Döngünüzü başlatmak için + butonuna basın',badge:'b-blue',gun:'—'};
  const sonBas=new Date(bas[bas.length-1]);
  const bugun=new Date();
  const gecenGun=Math.floor((bugun-sonBas)/864e5)+1;
  const uzunluk=donguData.uzunluk||28;
  const donemGun=((gecenGun-1)%uzunluk)+1;

  if(donemGun<=5) return {baslik:'Adet Dönemi',aciklama:`${donemGun}. gün — ${6-donemGun} gün daha`,badge:'b-pink',gun:`${donemGun}. gün`};
  if(donemGun<=13) return {baslik:'Folliküler Dönem',aciklama:'Enerji artıyor, egzersiz için harika!',badge:'b-green',gun:`${donemGun}. gün`};
  if(donemGun===14) return {baslik:'Ovülasyon',aciklama:'Zirve enerji günü! 🌟',badge:'b-yellow',gun:'Ovülasyon'};
  if(donemGun<=28) return {baslik:'Luteal Dönem',aciklama:`${uzunluk-donemGun+1} gün sonra yeni döngü`,badge:'b-purple',gun:`${donemGun}. gün`};
  return {baslik:'Döngü bekleniyor',aciklama:'Yeni adet yaklaşıyor',badge:'b-pink',gun:'Yakında'};
}

  <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;font-size:11px;color:var(--text2)">

    <span><span class="legend-dot" style="background:var(--green)"></span>Foliküler</span>

    <span><span class="legend-dot" style="background:var(--purple)"></span>Luteal</span>

  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:8px">

  for(let i=0;i<ayBaslangic.getDay();i++) html+=`<div></div>`;

  for(let d=1;d<=ayBitis.getDate();d++){
    const tarih=new Date(bugun.getFullYear(),bugun.getMonth(),d);
    const isToday=d===bugun.getDate();

    // Döngü gününü hesapla

    if(bas.length>0){
      const sonBas=new Date(bas[bas.length-1]);
      const gecen=Math.floor((tarih-sonBas)/864e5)+1;
      donguGun=((gecen-1)%uzunluk)+1;
      if(donguGun<=5)donguFaz='period';
      else if(donguGun<=13)donguFaz='fertile';
      else if(donguGun===14)donguFaz='ovulation';
      else donguFaz='luteal';
    }

    const bg=donguFaz==='period'?'var(--pink-bg)':donguFaz==='fertile'?'var(--green-bg)':donguFaz==='ovulation'?'var(--yellow-bg)':donguFaz==='luteal'?'var(--purple-bg)':'var(--card2)';
    const tc=donguFaz==='period'?'var(--pink)':donguFaz==='fertile'?'var(--green)':donguFaz==='ovulation'?'var(--yellow)':donguFaz==='luteal'?'var(--purple)':'var(--text2)';

    html+=`<div style="aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:${isToday?'800':'500'};background:${bg};color:${tc};border:${isToday?'2px solid var(--purple)':'1px solid transparent'}">${d}</div>`;
  }

  html+=`</div></div>`;

  // Yeni döngü başlat
  html+=`<div class="section-title">⚙️ Döngü Ayarları</div>
  <div class="card">
    <button class="btn btn-primary" style="width:100%;margin-bottom:10px" onclick="donguBaslat()">

    </button>
    <div class="row" style="margin-bottom:10px">
      <input type="date" id="gecmis-dongu-tarih" value="${todayStr()}" style="flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card2);color:var(--text);font-size:13px">
      <button class="btn-sm b-pink" style="background:var(--pink-bg);color:var(--pink);border-color:var(--pink-border)" onclick="donguGecmisEkle()">
        🩸 Geçmiş Tarihe Ekle
      </button>
    </div>
    <div class="row" style="margin-bottom:8px">
      <span style="font-size:13px;color:var(--text2)">Döngü uzunluğu:</span>
      <select onchange="donguUzunluk(parseInt(this.value))" style="margin-left:auto;width:80px;padding:6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card2);color:var(--text);font-size:13px">
        ${[21,24,25,26,27,28,29,30,31,32,35].map(u=>`<option value="${u}" ${u===uzunluk?'selected':''}>${u} gün</option>`).join('')}
      </select>

      <div style="font-size:12px;font-weight:600;color:var(--text2)">Kayıtlı döngüler:</div>
      ${[...bas].reverse().slice(0,5).map((t,i)=>`
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3)">

  document.getElementById('dongu-c').innerHTML=html;

function donguBaslat(){
  if(!confirm('Bugün adet başladı olarak kayıt edilsin mi?')) return;
  donguTarihEkle(todayStr());
}
function donguGecmisEkle(){
  const tarih=document.getElementById('gecmis-dongu-tarih')?.value;
  if(!tarih){alert('Tarih seçin!');return;}
  if(confirm(`${new Date(tarih).toLocaleDateString('tr-TR')} tarihine adet başlangıcı eklensin mi?`)){
    donguTarihEkle(tarih);
  }
}
function donguTarihEkle(tarih){
  if(!donguData.baslangiclar)donguData.baslangiclar=[];
  // Aynı tarihi ekleme
  if(donguData.baslangiclar.includes(tarih)){alert('Bu tarih zaten kayıtlı!');return;}
  donguData.baslangiclar.push(tarih);
  donguData.baslangiclar.sort(); // tarihe göre sırala
  if(donguData.baslangiclar.length>24)donguData.baslangiclar=donguData.baslangiclar.slice(-24);
  localStorage.setItem('ds_dongu_'+ogrenci._id,JSON.stringify(donguData));
  renderDongu();renderAnasayfa();
}
function donguSil(idx){
  const tarih=donguData.baslangiclar[idx];
  if(!confirm(`${new Date(tarih).toLocaleDateString('tr-TR')} döngüsü silinsin mi?`)) return;
  donguData.baslangiclar.splice(idx,1);
  localStorage.setItem('ds_dongu_'+ogrenci._id,JSON.stringify(donguData));
  renderDongu();renderAnasayfa();
}
function donguUzunluk(u){
  donguData.uzunluk=u;
  localStorage.setItem('ds_dongu_'+ogrenci._id,JSON.stringify(donguData));
  renderDongu();
}

    ${o.borc>0?`<div style="font-size:12px;color:var(--red);margin-top:8px">⚠️ ${o.borc} ders borcunuz var, paket açılınca düşülür</div>`:''}

  // Ödedim bildirimi

// ── ÖĞRENCİ ÖLÇÜMLER ──
async function renderOlcumlerim(){
  const el=document.getElementById('olcumlerim-c');
  if(!ogrenci){el.innerHTML='';return;}
  let olcumler=[];
  try{
    const {data,error}=await sb.from('olcumler').select('*')
      .eq('ogrenci_id',ogrenci._id).order('tarih',{ascending:true});
    if(!error) olcumler=data||[];
  }catch(e){}

  let html=`<div style="padding:20px 28px;width:100%;box-sizing:border-box"><div style="font-size:18px;font-weight:700;color:#2A2015;margin-bottom:16px">📏 Ölçümlerim</div>`;

  if(!olcumler.length){
    html+=`<div class="alert a-blue">Henüz ölçüm kaydınız yok. Stüdyonuz ölçüm yaptıktan sonra burada görünecek.</div>`;
    el.innerHTML=html+'</div>';return;
  }

  const son=olcumler[olcumler.length-1];
  const ilk=olcumler[0];

  // Son ölçüm özeti
  html+=`<div class="card" style="background:linear-gradient(135deg,rgba(29,185,122,.1),rgba(139,92,246,.08));border-color:var(--green-border)">
    <div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px">Son Ölçüm — ${new Date(son.tarih).toLocaleDateString('tr-TR')}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center">
      ${son.kilo?`<div><div style="font-size:22px;font-weight:800">${son.kilo}</div><div style="font-size:11px;color:var(--text2)">Kilo (kg)</div></div>`:''}
      ${son.yag_yuzdesi?`<div><div style="font-size:22px;font-weight:800;color:var(--yellow)">${son.yag_yuzdesi}%</div><div style="font-size:11px;color:var(--text2)">Yağ</div></div>`:''}
      ${son.kas_yuzdesi?`<div><div style="font-size:22px;font-weight:800;color:var(--blue)">${son.kas_yuzdesi}%</div><div style="font-size:11px;color:var(--text2)">Kas</div></div>`:''}
      ${son.bmi?`<div><div style="font-size:22px;font-weight:800">${son.bmi}</div><div style="font-size:11px;color:var(--text2)">BMI</div></div>`:''}
      ${son.su_yuzdesi?`<div><div style="font-size:22px;font-weight:800;color:var(--blue)">${son.su_yuzdesi}%</div><div style="font-size:11px;color:var(--text2)">Su</div></div>`:''}
    </div>
  </div>`;

  // İlerleme
  if(olcumler.length>1){
    const kiloFark=((son.kilo||0)-(ilk.kilo||0)).toFixed(1);
    const yagFark=son.yag_yuzdesi&&ilk.yag_yuzdesi?((son.yag_yuzdesi)-(ilk.yag_yuzdesi)).toFixed(1):null;
    html+=`<div class="section-title">📈 İlerleme</div>
    <div class="card">
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px">
        ${new Date(ilk.tarih).toLocaleDateString('tr-TR')} → ${new Date(son.tarih).toLocaleDateString('tr-TR')}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="metric" style="text-align:center">
          <div style="font-size:20px;font-weight:800;color:${kiloFark<0?'var(--green)':kiloFark>0?'var(--red)':'var(--text)'}">
            ${kiloFark>0?'+':''}${kiloFark} kg
          </div>
          <div style="font-size:11px;color:var(--text2)">Kilo değişimi</div>
        </div>
        ${yagFark!==null?`<div class="metric" style="text-align:center">
          <div style="font-size:20px;font-weight:800;color:${yagFark<0?'var(--green)':yagFark>0?'var(--red)':'var(--text)'}">
            ${yagFark>0?'+':''}${yagFark}%
          </div>
          <div style="font-size:11px;color:var(--text2)">Yağ değişimi</div>
        </div>`:''}
      </div>
    </div>`;
  }

  // Grafik
  const son8=olcumler.slice(-8);
  const maxK=Math.max(...son8.map(x=>x.kilo||0),1);
  html+=`<div class="section-title">📊 Kilo Grafiği</div>
  <div class="card">
    <div style="display:flex;align-items:flex-end;gap:5px;height:100px;margin-bottom:6px">
      ${son8.map(o=>{
        const h=Math.round(((o.kilo||0)/maxK)*90);
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
          <div style="font-size:9px;color:var(--text2);font-weight:600">${o.kilo||''}</div>
          <div style="width:100%;height:${h}px;background:var(--pilates);border-radius:4px 4px 0 0;min-height:2px"></div>
          <div style="font-size:9px;color:var(--text3)">${new Date(o.tarih).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  // Geçmiş tablo
  html+=`<div class="section-title">📋 Tüm Ölçümler</div>
  <div class="card" style="overflow-x:auto;padding:8px">
    <table style="width:100%;font-size:12px;border-collapse:collapse">
      <thead><tr style="border-bottom:1px solid var(--border)">
        <th style="padding:6px;text-align:left;color:var(--text2)">Tarih</th>
        <th style="padding:6px;text-align:center;color:var(--text2)">Kilo</th>
        <th style="padding:6px;text-align:center;color:var(--text2)">Yağ%</th>
        <th style="padding:6px;text-align:center;color:var(--text2)">Kas%</th>
        <th style="padding:6px;text-align:center;color:var(--text2)">BMI</th>
      </tr></thead><tbody>
      ${[...olcumler].reverse().map(o=>`
        <tr style="border-bottom:1px solid var(--border2)">
          <td style="padding:6px">${new Date(o.tarih).toLocaleDateString('tr-TR')}</td>
          <td style="padding:6px;text-align:center;font-weight:600">${o.kilo||'-'}</td>
          <td style="padding:6px;text-align:center;color:var(--yellow)">${o.yag_yuzdesi?o.yag_yuzdesi+'%':'-'}</td>
          <td style="padding:6px;text-align:center;color:var(--blue)">${o.kas_yuzdesi?o.kas_yuzdesi+'%':'-'}</td>
          <td style="padding:6px;text-align:center">${o.bmi||'-'}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;

  el.innerHTML=html;
}

function ibanKopyala(){
  navigator.clipboard.writeText('TR350006200033300006809960')
    .then(()=>alert('✅ IBAN kopyalandı!'))
    .catch(()=>{
      const el=document.getElementById('iban-text');
      const range=document.createRange();
      range.selectNode(el);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      alert('✅ IBAN kopyalandı!');
    });
}
function aciklamaKopyala(metin){
  navigator.clipboard.writeText(metin)
    .then(()=>alert('✅ Açıklama kopyalandı!'))
    .catch(()=>alert('Açıklamayı manuel kopyalayın:\n'+metin));
}
async function odemeyaptimBildir(){
  if(!ogrenci)return;
  if(!confirm('Ödeme yapıldı olarak stüdyoya bildirilsin mi?')) return;
  gosterLoading();
  try{
    const {error}=await sb.from('ogrenciler').update({odeme_bekliyor:true}).eq('id',ogrenci._id);
    if(error)throw error;
    ogrenci.odemeBekliyor=true;
    alert('✅ Bildiriminiz stüdyoya iletildi!\nOnaylanınca paketiniz açılacak.');
    renderOdeme();renderAnasayfa();
  }catch(e){alert('Hata: '+e.message);}
  gizleLoading();
}
