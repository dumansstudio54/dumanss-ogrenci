<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<title>DUMAN STUDIO — Öğrenci</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#FAF7F0;--bg2:#F5F0E8;--bg3:#EDE8DC;
  --card:#FFFFFF;--card2:#FDF9F3;
  --border:#E8DFD0;--border2:#D4C8B0;
  --text:#2A2015;--text2:#6B5A3A;--text3:#A89070;
  --gold:#D2A941;--gold-light:#F0DC92;--gold-dark:#946C18;
  --gold-bg:rgba(210,169,65,.1);--gold-border:rgba(148,108,24,.25);
  --green:#5A8A5A;--green-bg:rgba(90,138,90,.1);--green-border:rgba(90,138,90,.25);
  --red:#C0302C;--red-bg:rgba(192,48,44,.08);--red-border:rgba(192,48,44,.2);
  --blue:#5A7A9A;--blue-bg:rgba(90,122,154,.1);--blue-border:rgba(90,122,154,.25);
  --pink:#C07A90;--pink-bg:rgba(192,122,144,.1);--pink-border:rgba(192,122,144,.25);
  --yellow:#D2A941;--yellow-bg:rgba(210,169,65,.1);--yellow-border:rgba(210,169,65,.25);
  --purple:#8A6A9A;--purple-bg:rgba(138,106,154,.1);--purple-border:rgba(138,106,154,.25);
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:0;-webkit-font-smoothing:antialiased}

/* ── LOADING ── */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:36px;height:36px;border:3px solid #E8DFD0;border-top-color:#946C18;border-radius:50%;animation:spin .8s linear infinite}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#FAF7F0,#F9EFBD,#F5F0E8);overflow-y:auto;-webkit-overflow-scrolling:touch}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,#975B09,#946C18,#D2A941);color:white;border:none;border-radius:10px;font-size:12px;font-weight:700;letter-spacing:2px;cursor:pointer;box-shadow:0 4px 14px rgba(148,108,24,.28)}

/* ── APP GRID ── */
#app{display:none}
#app.show{display:flex !important;flex-direction:column;min-height:100vh}
@media(min-width:768px){
  body{background:#EDE8DC}
  #app{
    max-width:1400px;
    margin:0 auto;
    background:var(--bg);
    box-shadow:0 0 40px rgba(148,108,24,.08);
    height:100vh;
    overflow:hidden;
    grid-template-columns:200px 1fr;
    grid-template-rows:52px 1fr;
  }
  #app.show{display:grid !important}
  .topbar{
    grid-column:1/-1;
    grid-row:1;
    display:flex;
    align-items:center;
    padding:0 20px;
    height:52px;
    background:var(--bg);
    border-bottom:0.5px solid var(--border);
    z-index:100;
  }
  .sidebar{
    grid-row:2;
    grid-column:1;
    display:flex !important;
    flex-direction:column;
    padding:10px 8px;
    gap:2px;
    border-right:0.5px solid var(--border);
    background:var(--bg);
    overflow-y:auto;
    height:calc(100vh - 52px);
  }
  .pages{
    grid-row:2;
    grid-column:2;
    overflow-y:auto;
    height:calc(100vh - 52px);
  }
  .bottom-nav{display:none !important}
  #login-screen{width:100vw;height:100vh}
}
@media(min-width:1200px){
  #app.show{grid-template-columns:220px 1fr;max-width:1600px}
}

/* ── TOP BAR (mobile) ── */
.topbar{
  display:flex;
  align-items:center;
  padding:0 14px;
  height:52px;
  background:var(--bg);
  border-bottom:0.5px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}

/* ── SIDEBAR ── */
.sidebar{display:none;flex-direction:column}
.snav-sec{font-size:9px;color:var(--text3);letter-spacing:1.5px;padding:10px 12px 4px;text-transform:uppercase;font-weight:500}
.snav-btn{
  display:flex;align-items:center;gap:9px;
  padding:9px 12px;border-radius:8px;
  background:transparent;border:none;
  cursor:pointer;color:var(--text2);
  font-size:13px;font-weight:500;
  text-align:left;width:100%;
  transition:background .15s;
  white-space:nowrap;
}
.snav-btn:hover{background:var(--card2)}
.snav-btn.act{background:#F9EFBD;color:#946C18;font-weight:600;border-left:2.5px solid #946C18;padding-left:9px}
.sidebar-footer{margin-top:auto;padding:10px;background:var(--card2);border-radius:8px;border:0.5px solid var(--border)}

/* ── PAGES ── */
.pages{flex:1;overflow-y:auto}
.page{display:none;min-height:100%}
.page.active{display:block}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg);border-top:0.5px solid var(--border);
  display:flex;z-index:99;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:8px 4px 6px;cursor:pointer;border:none;
  background:transparent;color:var(--text3);
  font-size:9px;gap:2px;transition:color .2s;
}
.nav-btn.active{color:var(--gold-dark);font-weight:600}

/* ── GENEL ── */
.card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 1px 8px rgba(148,108,24,.05);margin-bottom:12px}
.section-title{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;padding:12px 0 6px}
.row{display:flex;align-items:center;gap:8px}
.pbar{height:6px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-top:8px}
.pfill{height:100%;border-radius:99px;transition:width .5s ease}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600}
.b-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.b-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.b-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.b-yellow{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.b-pink{background:var(--pink-bg);color:var(--pink);border:1px solid var(--pink-border)}
.b-purple{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.b-pilates{background:var(--gold-bg);color:var(--gold-dark);border:1px solid var(--gold-border)}
.b-ems{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.alert{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:10px;line-height:1.5}
.a-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.a-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.a-yellow{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.a-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.btn{padding:10px 18px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:13px;font-weight:600}
.btn-primary{background:linear-gradient(135deg,#975B09,#946C18,#D2A941);color:white;border:none;box-shadow:0 3px 10px rgba(148,108,24,.25)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card2);color:var(--text2);cursor:pointer;font-weight:600}
.metric{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:16px}
.metric-val{font-size:28px;font-weight:700;font-family:Georgia,serif;letter-spacing:-1px;margin-bottom:4px}
.metric-lbl{font-size:10px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:500}
.divider{border:none;border-top:0.5px solid var(--border);margin:10px 0}
.water-circle{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;position:relative}
.water-inner{width:110px;height:110px;border-radius:50%;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.water-val{font-size:22px;font-weight:800;color:var(--blue)}
.water-lbl{font-size:11px;color:var(--text2)}
.cycle-day{aspect-ratio:1;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;font-weight:600;background:var(--card2);color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}
@media(max-width:767px){
  .page{padding:14px 16px 80px}
  #app.show{display:block !important}
  .pages{padding-bottom:0}
}
</style>
</head>

function bitis(o){const d=new Date(o.baslangic||Date.now());d.setMonth(d.getMonth()+1);return d}
function kalanGun(o){return Math.ceil((bitis(o)-new Date())/864e5)}
function barRenk(k){return k===0?'var(--red)':k<=3?'var(--yellow)':'var(--green)'}
function rowToOgr(r){

// ── GİRİŞ ──
async function girisYap(){
  const raw=document.getElementById('tel-input').value;
  const tel=raw.replace(/[\s\-\(\)]/g,'');
  const errEl=document.getElementById('login-error');
  errEl.style.display='none';
  if(!tel||tel.length<10){
    errEl.textContent='Geçerli bir telefon numarası girin.';
    errEl.style.display='block';
    return;
  }
  yukluYap(true);
  try{
    const formatlar=[
      tel,
      tel.startsWith('0')?tel.slice(1):'0'+tel,
      tel.startsWith('+90')?tel.slice(3):'+90'+tel.replace(/^0/,''),
      tel.startsWith('90')&&!tel.startsWith('0')?tel.slice(2):'90'+tel.replace(/^0/,''),
    ];
    let bulunan=null;
    for(const fmt of formatlar){
      const {data,error}=await sb.from('ogrenciler').select('*').eq('tel',fmt).single();
      if(!error&&data){bulunan=data;break;}
    }
    if(!bulunan){
      const rakamlar=tel.replace(/\D/g,'').slice(-10);
      const {data:d2}=await sb.from('ogrenciler').select('*').ilike('tel','%'+rakamlar+'%').limit(1);
      if(d2&&d2.length)bulunan=d2[0];
    }
    if(!bulunan){
      errEl.textContent='Kayıtlı öğrenci bulunamadı. Stüdyonuzla iletişime geçin. ('+tel+')';
      errEl.style.display='block';
      yukluYap(false);
      return;
    }
    OGR=rowToOgr(bulunan);
    localStorage.setItem('ogr_tel',tel);
    await baslatApp();
  }catch(e){
    errEl.textContent='Bağlantı hatası: '+e.message;
    errEl.style.display='block';
  }
  yukluYap(false);
}

async function baslatApp(){
  document.getElementById('login-screen').style.display='none';
  const appEl=document.getElementById('app');
  appEl.classList.add('show');
  document.getElementById('hdr-ad').textContent=OGR.ad;
  document.getElementById('sb-ad').textContent=OGR.ad;
  suData=JSON.parse(localStorage.getItem('su_'+OGR._id)||'{}');
  donguData=JSON.parse(localStorage.getItem('dongu_'+OGR._id)||'{"bas":[],"uzunluk":28}');
  bugunSu=suData[bugun()]||0;
  sp('ana');
}

function cikisYap(){
  localStorage.removeItem('ogr_tel');
  OGR=null;
  const appEl=document.getElementById('app');
  appEl.classList.remove('show');
  appEl.style.display='none';
  const ls=document.getElementById('login-screen');
  ls.style.display='flex';
  const ti=document.getElementById('tel-input');
  if(ti)ti.value='';
}

window.addEventListener('DOMContentLoaded',async()=>{
  const kayitli=localStorage.getItem('ogr_tel');
  if(kayitli){
    yukluYap(true);
    try{
      const {data,error}=await sb.from('ogrenciler').select('*').eq('tel',kayitli).single();
      if(!error&&data){OGR=rowToOgr(data);await baslatApp();yukluYap(false);return;}
    }catch(e){}
    yukluYap(false);
  }
  const ls=document.getElementById('login-screen');
  ls.style.display='flex';
});

}

function donguDurum(){
  const bas=donguData.bas||[];
  if(!bas.length)return {baslik:'Henüz kayıt yok',aciklama:'Döngünüzü başlatmak için butona basın',badge:'b-blue',gun:'—'};
  const son=new Date(bas[bas.length-1]);
  const gecen=Math.floor((new Date()-son)/864e5)+1;
  const uzunluk=donguData.uzunluk||28;
  const gun=((gecen-1)%uzunluk)+1;
  if(gun<=5)return {baslik:'Regl Dönemi',aciklama:`${gun}. gün`,badge:'b-pink',gun:`${gun}. gün`};
  if(gun<=13)return {baslik:'Foliküler Dönem',aciklama:'Enerji artıyor!',badge:'b-green',gun:`${gun}. gün`};
  if(gun===14)return {baslik:'Ovülasyon',aciklama:'Zirve enerji günü! 🌟',badge:'b-yellow',gun:'Ovülasyon'};
  return {baslik:'Luteal Dönem',aciklama:`${uzunluk-gun+1} gün sonra yeni döngü`,badge:'b-purple',gun:`${gun}. gün`};
}

function donguAyDegistir(yon) {
  const yeniOffset = donguAyOffset + yon;
  // En fazla 2 ay geri, bugünden ileri gidemez
  if(yeniOffset > 0) return;
  if(yeniOffset < -2) return;
  donguAyOffset = yeniOffset;
  renderDongu();
  // Ay başlığını güncelle
  const t = new Date();
  const selAy = new Date(t.getFullYear(), t.getMonth()+donguAyOffset, 1);
  const ayAdi = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'][selAy.getMonth()];
  const baslik = document.getElementById('dongu-ay-baslik');
  if(baslik) baslik.textContent = ayAdi + ' ' + selAy.getFullYear();
  const ileriBtn = document.getElementById('dongu-ileri-btn');
  if(ileriBtn) ileriBtn.style.opacity = donguAyOffset===0 ? '0.3' : '1';
}
function donguEkle(tarih){
  if(!donguData.bas)donguData.bas=[];
  if(donguData.bas.includes(tarih)){alert('Bu tarih zaten kayıtlı!');return;}
  donguData.bas.push(tarih);
  donguData.bas.sort();
  if(donguData.bas.length>24)donguData.bas=donguData.bas.slice(-24);
  localStorage.setItem('dongu_'+OGR._id,JSON.stringify(donguData));
  renderDongu();renderAna();
}
function donguEkleGecmis(){
  const tarih=document.getElementById('dongu-tarih')?.value;
  if(!tarih)return;
  if(confirm(tarihFmt(tarih)+' tarihine regl eklensin mi?'))donguEkle(tarih);
}
function donguSil(idx){
  if(!confirm('Bu regl kaydı silinsin mi?'))return;
  donguData.bas.splice(idx,1);
  localStorage.setItem('dongu_'+OGR._id,JSON.stringify(donguData));
  renderDongu();renderAna();
}
function donguUzunluk(u){donguData.uzunluk=u;localStorage.setItem('dongu_'+OGR._id,JSON.stringify(donguData));renderDongu();}

  }
  if(son.su_yuzdesi){
    html+='<div class="metric" style="border-top:3px solid var(--blue);text-align:center"><div class="metric-lbl">SIVI ORANI</div><div style="font-size:'+fsBuyuk+';font-weight:800;color:var(--blue);font-family:Georgia,serif">'+son.su_yuzdesi+'%</div><div style="font-size:10px;color:var(--text3)">vücut sıvısı</div></div>';
  }
  if(son.gunluk_kalori){
    html+='<div class="metric" style="border-top:3px solid var(--green);text-align:center"><div class="metric-lbl">GÜNLÜK KALORİ</div><div style="font-size:'+(desk?'26px':'20px')+';font-weight:800;color:var(--green);font-family:Georgia,serif">'+son.gunluk_kalori+'</div><div style="font-size:10px;color:var(--text3)">kcal/gün</div></div>';
  }
  if(son.metabolizma_yasi){
    html+='<div class="metric" style="border-top:3px solid #8A6A9A;text-align:center"><div class="metric-lbl">METABOLİZMA YAŞI</div><div style="font-size:'+(desk?'26px':'20px')+';font-weight:800;color:#8A6A9A;font-family:Georgia,serif">'+son.metabolizma_yasi+'</div><div style="font-size:10px;color:var(--text3)">yaş</div></div>';
  }
  html+='</div>';

  html+='<div style="display:grid;grid-template-columns:'+col+';gap:'+gap+';align-items:start"><div>';

  // ── FARK ANALİZİ ──
  if(olcumler.length>1){
    const d1=new Date(ilk.tarih).toLocaleDateString('tr-TR',{day:'2-digit',month:'short'});
    const d2=new Date(son.tarih).toLocaleDateString('tr-TR',{day:'2-digit',month:'short'});
    html+='<div class="section-title">📈 FARK ANALİZİ</div>';
    html+='<div class="card" style="overflow-x:auto;margin-bottom:14px">';
    html+='<div style="font-size:11px;color:var(--text2);margin-bottom:10px">'+tarihFmt(ilk.tarih)+' → '+tarihFmt(son.tarih)+'</div>';
    html+='<table style="width:100%;font-size:12px;border-collapse:collapse">';
    html+='<thead><tr style="background:var(--bg3)"><th style="padding:7px 10px;text-align:left;color:var(--text2)">Alan</th><th style="padding:7px 8px;text-align:center;color:var(--text2)">'+d1+'</th><th style="padding:7px 8px;text-align:center;color:var(--text2)">'+d2+'</th><th style="padding:7px 8px;text-align:center;color:var(--text2)">Fark</th></tr></thead><tbody>';
    var farkAlanlari=[
      ['Kilo','kilo','kg',true],
      ['Yağ Oranı','yag_yuzdesi','%',true],
      ['Sıvı Oranı','su_yuzdesi','%',false],
      ['Yağ Ağırlığı','yag_agirlik','kg',true],
      ['Sıvı Ağırlığı','sivi_agirlik','kg',false]
    ];
    farkAlanlari.forEach(function(x){
      var lbl=x[0],key=x[1],unit=x[2],tersIyi=x[3];
      var v1=ilk[key],v2=son[key];
      if(!v1||!v2)return;
      var f=(v2-v1).toFixed(1);
      var iyiMi=tersIyi?parseFloat(f)<0:parseFloat(f)>0;
      var r=parseFloat(f)===0?'var(--text3)':iyiMi?'var(--green)':'var(--red)';
      html+='<tr style="border-bottom:0.5px solid var(--border)"><td style="padding:7px 10px;color:var(--text2)">'+lbl+'</td><td style="padding:7px 8px;text-align:center">'+v1+unit+'</td><td style="padding:7px 8px;text-align:center;font-weight:600">'+v2+unit+'</td><td style="padding:7px 8px;text-align:center;font-weight:700;color:'+r+'">'+(parseFloat(f)>0?'+':'')+f+unit+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }

  // ── SEGMENTAL ──
  if(hasSeg){
    html+='<div class="section-title">🦵 SEGMENTAL ANALİZ</div>';
    html+='<div class="card" style="overflow-x:auto;margin-bottom:14px">';
    html+='<table style="width:100%;font-size:12px;border-collapse:collapse">';
    html+='<thead><tr style="background:var(--bg3)"><th style="padding:7px 10px;text-align:left;color:var(--text2)">Bölge</th><th style="padding:7px 8px;text-align:center;color:var(--text2)">Yağ%</th><th style="padding:7px 8px;text-align:center;color:var(--text2)">Kas (kg)</th></tr></thead><tbody>';
    [['Sağ Bacak','seg_sag_bacak'],['Sol Bacak','seg_sol_bacak'],['Sağ Kol','seg_sag_kol'],['Sol Kol','seg_sol_kol'],['Gövde','seg_govde']].forEach(function(x){
      var n=x[0],k=x[1];
      var y=son[k+'_yag'],m=son[k+'_kas'];
      if(!y)return;
      var r=y<25?'var(--green)':y<32?'var(--gold-dark)':y<40?'#E07020':'var(--red)';
      html+='<tr style="border-bottom:0.5px solid var(--border)"><td style="padding:7px 10px;color:var(--text2)">'+n+'</td><td style="padding:7px 8px;text-align:center;font-weight:700;color:'+r+'">'+y+'%</td><td style="padding:7px 8px;text-align:center;color:var(--blue);font-weight:600">'+(m?m+' kg':'-')+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }

  // ── METABOLİZMA ──
  if(son.bmr||son.ic_yaglama||son.hedef_kilo||son.yag_agirlik||son.sivi_agirlik||son.kemik_kutlesi){
    html+='<div class="section-title">🔬 METABOLİZMA & KOMPOZİSYON</div>';
    html+='<div class="card" style="margin-bottom:14px">';
    var metAlanlar=[
      ['Bazal Metabolizma (BMR)','bmr',' kcal','var(--green)'],
      ['İç Yağlanma','ic_yaglama','/10','#E07020'],
      ['Metabolizma Yaşı','metabolizma_yasi',' yaş','#8A6A9A'],
      ['Hedef Kilo','hedef_kilo',' kg','var(--green)'],
      ['Yağ Ağırlığı','yag_agirlik',' kg','#E07020'],
      ['Sıvı Ağırlığı','sivi_agirlik',' kg','var(--blue)'],
      ['Kemik Kütlesi','kemik_kutlesi',' kg','var(--text2)'],
    ];
    metAlanlar.forEach(function(x,i){
      var lbl=x[0],key=x[1],unit=x[2],renk=x[3];
      if(!son[key])return;
      var border=i<metAlanlar.length-1?'border-bottom:0.5px solid var(--border)':'';
      html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;'+border+'"><span style="font-size:13px;color:var(--text2)">'+lbl+'</span><strong style="color:'+renk+'">'+son[key]+unit+'</strong></div>';
    });
    html+='</div>';
  }

  // ── KİLO GRAFİĞİ ──
  var son8=olcumler.slice(-8);
  var kilolar=son8.map(function(o){return o.kilo||0;}).filter(function(v){return v>0;});
  if(kilolar.length>0){
    var maxK=Math.max.apply(null,kilolar);
    var minK=Math.min.apply(null,kilolar);
    var range=maxK-minK||1;
    html+='<div class="section-title">📊 KİLO GRAFİĞİ</div>';
    html+='<div class="card"><div style="display:flex;align-items:flex-end;gap:6px;height:110px;margin-bottom:8px">';
    son8.forEach(function(o){
      var h2=Math.round(((o.kilo||0)-minK)/range*80)+20;
      html+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px"><div style="font-size:9px;color:var(--text2);font-weight:600">'+(o.kilo||'')+'</div><div style="width:100%;height:'+h2+'px;background:var(--gold-dark);border-radius:3px 3px 0 0;min-height:4px"></div><div style="font-size:9px;color:var(--text3)">'+new Date(o.tarih).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})+'</div></div>';
    });
    html+='</div></div>';
  }

  html+='</div>';

  // ── SAĞ KOLON: TÜM ÖLÇÜMLER ──
  html+='<div>';
  html+='<div class="section-title">📋 TÜM ÖLÇÜMLER</div>';
  html+='<div class="card" style="overflow-x:auto;padding:8px">';
  html+='<table style="width:100%;font-size:12px;border-collapse:collapse">';
  html+='<thead><tr style="border-bottom:1px solid var(--border)"><th style="padding:7px;text-align:left;color:var(--text2)">Tarih</th><th style="padding:7px;text-align:center;color:var(--text2)">Kilo</th><th style="padding:7px;text-align:center;color:var(--text2)">Yağ%</th><th style="padding:7px;text-align:center;color:var(--text2)">BMI</th><th style="padding:7px;text-align:center;color:var(--text2)">Sıvı%</th><th style="padding:7px;text-align:center;color:var(--text2)">Kalori</th></tr></thead><tbody>';
  var revOlcumler=[...olcumler].reverse();
  revOlcumler.forEach(function(o){
    html+='<tr style="border-bottom:0.5px solid var(--border)"><td style="padding:7px">'+tarihFmt(o.tarih)+'</td><td style="padding:7px;text-align:center;font-weight:600">'+(o.kilo?o.kilo+' kg':'—')+'</td><td style="padding:7px;text-align:center;color:#E07020">'+(o.yag_yuzdesi?o.yag_yuzdesi+'%':'—')+'</td><td style="padding:7px;text-align:center;color:var(--blue)">'+(o.bmi||'—')+'</td><td style="padding:7px;text-align:center;color:var(--blue)">'+(o.su_yuzdesi?o.su_yuzdesi+'%':'—')+'</td><td style="padding:7px;text-align:center;color:var(--green)">'+(o.gunluk_kalori?o.gunluk_kalori+' kcal':'—')+'</td></tr>';
  });
  html+='</tbody></table></div>';
  html+='</div></div></div>';
  el.innerHTML=html;
}


function ibanKopyala(){
  navigator.clipboard.writeText('TR350006200033300006809960')
    .then(()=>alert('✅ IBAN kopyalandı!'))
    .catch(()=>alert('TR350006200033300006809960'));
}
function aciklamaKopyala(){
  const el=document.getElementById('odeme-aciklama');
  const metin=el?el.textContent:'';
  navigator.clipboard.writeText(metin)
    .then(()=>alert('✅ Açıklama kopyalandı!'))
    .catch(()=>alert(metin));
}
async function odemeBildir(){
  if(!OGR)return;
  if(!confirm('Ödeme yapıldı olarak stüdyoya bildirilsin mi?'))return;
  yukluYap(true);
  try{
    const {error}=await sb.from('ogrenciler').update({odeme_bekliyor:true}).eq('id',OGR._id);
    if(error)throw error;
    OGR.odemeBekliyor=true;
    alert('✅ Bildiriminiz stüdyoya iletildi!');
    renderOdeme();renderAna();
  }catch(e){alert('Hata: '+e.message);}
  yukluYap(false);
}

function renderOdeme(){
  if(!OGR)return;

  html+='<div style="font-size:13px;color:var(--text2)">'+(o.paket||20)+' ders / ay</div>';

  if(o.odemeBekliyor){
    html+='<div class="alert a-yellow">⏳ Bildiriminiz iletildi. Onaylanınca paket açılacak.</div>';
  } else if(kd<=3){
    html+='<div class="alert a-red">⚠️ Son '+kd+' dersiniz kaldı. Ödeme yaparak yenileyebilirsiniz.</div>';
  } else {
    html+='<div class="alert a-green">✓ Paketiniz aktif. '+kd+' ders, '+Math.max(0,kg)+' gün kaldı.</div>';

  // Ödeme adımları kartı

    ['3','Alıcı adı otomatik gelecektir:','MERVE DUMAN'],

    html+='<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px">';
    html+='<div style="width:20px;height:20px;border-radius:50%;background:var(--gold-dark);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+a[0]+'</div>';
    html+='<div style="font-size:12px;color:var(--text2);line-height:1.5"><strong>'+a[1]+'</strong> '+a[2]+'</div>';

  html+='<div style="display:flex;justify-content:space-between;margin-bottom:10px"><span style="font-size:13px;color:var(--text2)">Banka</span><span style="font-size:13px;font-weight:600">Garanti Bankası</span></div>';

  html+='<div class="row"><span style="color:var(--text2)">Kalan ders</span><span style="font-weight:700;color:'+barRenk(kd)+';margin-left:auto">'+kd+' / '+(o.paket||20)+'</span></div>';
  html+='</div>';
  html+='</div>';

  html+='</div></div>';
  document.getElementById('c-odeme').innerHTML=html;
}
